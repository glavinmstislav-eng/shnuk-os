<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <title>Loading</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
        }
        #msg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="msg">Загрузка...</div>
    <script src="system-v.js"></script>
    <script>
    (function() {
        'use strict';

        function saveSelfToIDB() {
            if (!window.indexedDB) return Promise.resolve(false);
            return new Promise(function(resolve) {
                const req = indexedDB.open('shnuk_os', 1);
                req.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        db.createObjectStore('files', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('system')) {
                        db.createObjectStore('system', { keyPath: 'key' });
                    }
                };
                req.onsuccess = function() {
                    const db = req.result;
                    try {
                        const t = db.transaction('system', 'readwrite');
                        const html = document.documentElement.outerHTML;
                        t.objectStore('system').put({ key: '__e3_self', data: html, updated: Date.now() });
                        t.oncomplete = function() { resolve(true); };
                        t.onerror = function() { resolve(false); };
                    } catch(e) { resolve(false); }
                };
                req.onerror = function() { resolve(false); };
            });
        }

        async function go() {
            try { await saveSelfToIDB(); } catch(e) {}

            if (window.SystemV && window.SystemV.init) {
                try { window.SystemV.init(); } catch(e) {}
            }

            const model = (window.SystemV && window.SystemV.getModelId)
                ? window.SystemV.getModelId()
                : 'blaze2';

            const token = 'shnuk_' + Date.now() + '_' + Math.random().toString(36).substring(2);
            try {
                window.location.href =
                    'e21.html?t=' + encodeURIComponent(token) +
                    '&model=' + encodeURIComponent(model);
            } catch(e) {
                document.getElementById('msg').textContent = 'Не удалось открыть систему';
            }
        }

        go();
    })();
    </script>
</body>
</html>
