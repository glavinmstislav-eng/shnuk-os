<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Shnuk OS</title>
    <style>
        :root {
            --livebar-h: 44px;
            --accent: #cc0000;
            --accent-dark: #990000;
            --text-on-accent: #ffffff;
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f0f0f0;
            --bg-hover: #fff5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --header-bg: #f5f5f5;
            --header-text: #1a1a1a;
            --livebar-bg: #ffffff;
            --livebar-text: #1a1a1a;
            --panel-bg: rgba(255, 255, 255, 0.85);

            --desktop-cols: 4;
            --desktop-rows: 2;
            --apps-cols: 4;
            --apps-rows: 3;
        }

        [data-theme="evening"] {
            --accent: #cc0000;
            --accent-dark: #990000;
            --text-on-accent: #ffffff;
            --bg-primary: #2a2a2a;
            --bg-secondary: #333333;
            --bg-tertiary: #3a3a3a;
            --bg-hover: #3a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #999999;
            --border-color: #444444;
            --header-bg: #333333;
            --header-text: #ffffff;
            --livebar-bg: #2a2a2a;
            --livebar-text: #ffffff;
            --panel-bg: rgba(42, 42, 42, 0.9);
        }

        [data-theme="warm-night"] {
            --accent: #ffe066;
            --accent-dark: #e6c94d;
            --text-on-accent: #000000;
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --bg-hover: #1a1a00;
            --text-primary: #ffffff;
            --text-secondary: #dddddd;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --header-bg: #ffe066;
            --header-text: #000000;
            --livebar-bg: #000000;
            --livebar-text: #ffffff;
            --panel-bg: rgba(0, 0, 0, 0.9);
        }

        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'TTPaplane', monospace;
        }

        html, body {
            width: 100%; height: 100%;
            font-family: 'TTPaplane', monospace, sans-serif;
            font-size: 20px;
            touch-action: none; overflow: hidden;
            background: var(--bg-primary);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            transition: background 0.4s ease, color 0.4s ease;
        }

        #osApp { display: none; position: relative; width: 100%; height: 100%; overflow: hidden; }
        #osApp.visible { display: block; }

        .app-background {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease, filter 0.35s ease, transform 0.35s ease, background-color 0.4s ease;
            z-index: 0;
            overflow: hidden;
            background-color: var(--bg-primary);
            touch-action: none;
        }
        .app-background.white-bg { background: var(--bg-primary) !important; transform: none !important; }
        .app-background.blurred { filter: blur(30px); transform: scale(1.15); }

        .top-panel {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            display: flex;
            flex-direction: column;
            padding: 0 20px 24px 20px;
            background: transparent;
            z-index: 5;
            transition: opacity 0.35s ease, background 0.25s ease;
            will-change: opacity;
            pointer-events: none;
        }
        .top-panel .button-group,
        .top-panel .desktop-search { pointer-events: auto; }
        .top-panel.swiped-down { opacity: 0; pointer-events: none; }
        .top-panel.editing { background: var(--panel-bg); pointer-events: auto; }

        .edit-title {
            position: absolute;
            top: 24px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 15;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .top-panel.editing .edit-title {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .edit-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--text-primary);
            font-family: 'TTPaplane', monospace;
            font-size: 30px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
            z-index: 16;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .top-panel.editing .edit-close {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .edit-close:hover { color: var(--accent); }
        .edit-close:active { transform: scale(0.9); }

        .button-group {
            display: grid;
            grid-template-columns: repeat(var(--desktop-cols, 4), 1fr);
            grid-auto-rows: minmax(80px, auto);
            justify-items: center;
            align-items: center;
            gap: 20px 24px;
            max-width: 620px;
            width: 100%;
            margin: auto auto 0 auto;
            padding: 10px 0 0;
            touch-action: none;
            z-index: 3;
        }

        .btn-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .btn {
            width: 100%; height: 100%;
            background: transparent !important; border: none; cursor: grab;
            box-shadow: none !important; outline: none !important;
            transition: transform 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
            -webkit-tap-highlight-color: transparent; touch-action: none;
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 0; overflow: visible; border-radius: 0;
        }
        .btn img { width: 100%; height: 100%; object-fit: contain; display: block; z-index: 1; position: relative; pointer-events: none; }
        .btn.dragging { cursor: grabbing; transform: scale(1.12); z-index: 1000; opacity: 0.92; filter: blur(0.5px); }
        .btn.editable { cursor: grab; }
        .button-group.edit-mode .btn:not(.dragging) { animation: wiggle 1.2s ease-in-out infinite; }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(2deg); }
            30% { transform: rotate(-2deg); }
            45% { transform: rotate(1.5deg); }
            60% { transform: rotate(-1.5deg); }
            75% { transform: rotate(0.5deg); }
            90% { transform: rotate(-0.5deg); }
        }
        .btn:active { transform: scale(0.94); filter: blur(0.5px); }

        .btn-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 24px;
            height: 24px;
            background: var(--accent);
            color: var(--text-on-accent);
            border: 2px solid var(--bg-primary);
            border-radius: 50%;
            font-size: 15px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            font-family: 'TTPaplane', monospace;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.6);
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-tap-highlight-color: transparent;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-group.edit-mode .btn-remove {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .btn-remove:active { transform: scale(0.85); }

        .desktop-search {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding-top: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            z-index: 4;
            position: relative;
        }
        .desktop-search .search-input-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .desktop-search input {
            width: 100%;
            padding: 14px 56px 14px 22px;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            background: var(--panel-bg);
            color: var(--text-primary);
            font-family: 'TTPaplane', monospace;
            font-size: 17px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .desktop-search input:focus { border-color: var(--accent); }
        .desktop-search input::placeholder { color: var(--text-muted); }
        .search-submit {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%) scale(0.6);
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: var(--text-on-accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .search-submit.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }
        .search-submit:hover { background: var(--accent-dark); }
        .search-submit:active { transform: translateY(-50%) scale(0.9); }
        .search-submit svg {
            width: 18px;
            height: 18px;
            display: block;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bottom-panel {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            z-index: 1;
            overflow-y: auto; overflow-x: hidden;
            padding: 30px 20px 200px;
            display: flex; flex-direction: column; align-items: center;
            -webkit-overflow-scrolling: touch;
            opacity: 0; pointer-events: none;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            will-change: opacity, transform;
            transform: scale(1.05);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.4s ease;
        }
        .bottom-panel.visible { opacity: 1; pointer-events: all; transform: scale(1); }

        .bottom-panel.closing {
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.4s ease;
        }

        .bottom-panel .bottom-blur {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 110px;
            pointer-events: none;
            z-index: 22;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            -webkit-mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .bottom-panel.visible .bottom-blur { opacity: 1; }

        .bottom-panel .close-apps {
            position: absolute; top: 16px; right: 20px;
            width: 40px;
            height: 40px;
            padding: 0;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'TTPaplane', monospace;
            font-size: 30px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            transition: color 0.2s ease, transform 0.15s ease;
        }
        .bottom-panel .close-apps:hover { color: var(--accent); }
        .bottom-panel .close-apps:active { transform: scale(0.9); }

        .bottom-panel h2 {
            font-size: 26px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 24px; letter-spacing: -0.3px;
            z-index: 3;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(var(--apps-cols, 4), 1fr);
            grid-auto-rows: minmax(0, auto);
            gap: 20px 16px;
            max-width: 520px; width: 100%;
            z-index: 3;
            position: relative;
        }

        .icon-item {
            aspect-ratio: 1 / 1;
            background: transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.2s ease; cursor: pointer;
            padding: 6px;
            border: none; outline: none;
            max-width: 90px; max-height: 90px;
            justify-self: center; width: 100%;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            opacity: 1;
            transform: none;
        }
        .bottom-panel.visible .icon-item {
            animation: iconRise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes iconRise {
            from { opacity: 0; transform: translateY(28px); filter: blur(8px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }
        .icon-item:active { transform: scale(0.9); }
        .icon-item img { width: 80%; height: 80%; object-fit: contain; }
        .icon-item .icon-label {
            font-size: 13px; color: var(--text-primary); margin-top: 2px;
            text-align: center; line-height: 1.2;
            font-family: 'TTPaplane', monospace;
        }
        .icon-item .icon-default { font-size: 40px; line-height: 1; color: var(--text-primary); }
        .icon-item.html-app::after {
            content: 'HTML'; position: absolute; top: 0; left: 0;
            font-size: 10px; background: #4488ff; color: #fff;
            padding: 1px 5px; border-radius: 2px;
            font-weight: 700; letter-spacing: 0.5px;
        }

        .apps-search-bar {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            bottom: 20px;
            width: calc(100% - 40px);
            max-width: 620px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 60;
            box-sizing: border-box;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .apps-search-bar.visible {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .apps-search-bar .search-input-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .apps-search-bar input {
            width: 100%;
            padding: 14px 56px 14px 22px;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'TTPaplane', monospace;
            font-size: 17px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .apps-search-bar input:focus { border-color: var(--accent); }
        .apps-search-bar input::placeholder { color: var(--text-muted); }
        .apps-search-bar .search-submit {
            background: var(--accent);
            color: var(--text-on-accent);
        }
        .apps-search-bar .search-submit:hover { background: var(--accent-dark); }

        .add-desktop-btn {
            position: fixed;
            left: 50%;
            bottom: 84px;
            transform: translateX(-50%) translateY(20px);
            padding: 14px 26px;
            border: none;
            background: var(--accent);
            color: var(--text-on-accent);
            font-family: 'TTPaplane', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            z-index: 65;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s;
            box-shadow: 0 10px 30px rgba(204,0,0,0.4);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .add-desktop-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .add-desktop-btn:hover { background: var(--accent-dark); }
        .add-desktop-btn:active { transform: translateX(-50%) translateY(0) scale(0.96); }

        .picker-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            z-index: 2147483600;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease, backdrop-filter 0.3s ease, background 0.3s ease;
        }
        .picker-backdrop.visible {
            opacity: 1;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .picker-modal {
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
            font-family: 'TTPaplane', monospace;
            border-radius: 0;
        }
        .picker-backdrop.visible .picker-modal {
            transform: scale(1) translateY(0);
        }
        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--header-bg);
            color: var(--header-text);
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }
        .picker-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        .picker-close {
            width: 36px;
            height: 36px;
            background: none;
            border: none;
            color: inherit;
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .picker-close:hover { color: var(--accent); }
        .picker-close:active { transform: scale(0.9); }

        .picker-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 14px;
            -webkit-overflow-scrolling: touch;
        }
        .picker-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 12px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }
        .picker-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 6px 8px;
            border: 2px solid transparent;
            border-radius: 0;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            background: transparent;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
            font-family: 'TTPaplane', monospace;
        }
        .picker-item:hover {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }
        .picker-item:active {
            transform: scale(0.94);
        }
        .picker-item .picker-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }
        .picker-item .picker-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .picker-item .picker-icon-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            color: var(--accent);
            font-size: 26px;
            font-weight: 700;
            border-radius: 0;
        }
        .picker-item .picker-name {
            font-size: 11px;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.2;
            word-break: break-word;
            max-width: 100%;
        }

        .loader {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 20px; color: var(--text-muted); font-size: 18px;
            grid-column: 1 / -1;
        }
        .loader .spinner {
            width: 24px; height: 24px;
            border: 3px solid var(--border-color); border-top: 3px solid var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .html-app-window {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100001; background: var(--bg-primary);
