<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'ST-SimpleSquare', monospace, sans-serif;
        }
        .error-message {
            color: #cc0000;
            font-size: 20px;
            line-height: 1.6;
            text-align: center;
            max-width: 720px;
            letter-spacing: 0.3px;
        }
        @media (max-width: 500px) {
            .error-message {
                font-size: 16px;
                line-height: 1.5;
            }
        }
    </style>
</head>
<body>
    <div class="error-message">Похоже, ваше устройство было получено нелегальным способом. К сожалению, нам придется заблокировать его. Важно, что вы не платили деньги за него, таким образом оно вашим не является.</div>
</body>
</html>
