<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cooop Share</title>
    <style>
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'TTPaplane', monospace;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            color: #1a1a1a;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
            position: relative;
            isolation: isolate;
        }

        body.scroll-blur::after {
            content: '';
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 80px;
            pointer-events: none;
            z-index: 20;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            -webkit-mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
        }

        .cs-wrap {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
        }

        .cs-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cs-logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #cc0000;
        }

        .cs-title {
            font-size: 14px;
            color: #666666;
            letter-spacing: 0.5px;
        }

        .cs-card {
            border: 2px solid #e0e0e0;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cs-file-name {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            word-break: break-all;
            line-height: 1.3;
        }

        .cs-file-meta {
            font-size: 13px;
            color: #666666;
            line-height: 1.5;
        }

        .cs-file-meta b {
            color: #1a1a1a;
            font-weight: 700;
        }

        .cs-status {
            font-size: 13px;
            color: #666666;
            min-height: 18px;
            line-height: 1.5;
            word-break: break-word;
        }

        .cs-status.error {
            color: #cc0000;
        }

        .cs-status.success {
            color: #2e7d32;
        }

        .cs-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: none;
            background: #cc0000;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .cs-btn:hover {
            background: #990000;
        }

        .cs-btn:disabled {
            background: #999999;
            cursor: not-allowed;
        }

        .cs-progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            overflow: hidden;
            display: none;
        }

        .cs-progress.active {
            display: block;
        }

        .cs-progress-bar {
            height: 100%;
            width: 0%;
            background: #cc0000;
            transition: width 0.3s ease;
        }

        .cs-hint {
            font-size: 12px;
            color: #888888;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            body { padding: 20px 16px; }
            .cs-logo { font-size: 24px; }
            .cs-file-name { font-size: 16px; }
            .cs-card { padding: 16px; }
        }
    </style>
</head>
<body class="scroll-blur">
    <div class="cs-wrap">
        <div class="cs-header">
            <div class="cs-logo">Cooop</div>
            <div class="cs-title">P2P-скачивание</div>
        </div>

        <div class="cs-card">
            <div class="cs-file-name" id="csFileName">—</div>
            <div class="cs-file-meta" id="csFileMeta">Ожидание подключения...</div>
            <div class="cs-progress" id="csProgress">
                <div class="cs-progress-bar" id="csProgressBar"></div>
            </div>
            <div class="cs-status" id="csStatus"></div>
        </div>

        <button class="cs-btn" id="csDownloadBtn" disabled>СКАЧАТЬ ФАЙЛ</button>

        <div class="cs-hint" id="csHint">
            Файл скачивается напрямую с устройства раздающего по WebRTC.
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const SIGNAL_URL = 'wss://relay.ws/';
        const ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ];

        const nameEl = document.getElementById('csFileName');
        const metaEl = document.getElementById('csFileMeta');
        const statusEl = document.getElementById('csStatus');
        const progressEl = document.getElementById('csProgress');
        const progressBarEl = document.getElementById('csProgressBar');
        const downloadBtn = document.getElementById('csDownloadBtn');
        const hintEl = document.getElementById('csHint');

        let params = null;
        let pc = null;
        let dc = null;
        let socket = null;
        let receivedChunks = [];
        let receivedBytes = 0;
        let expectedMeta = null;
        let finalBlob = null;
        let connected = false;
        let finished = false;

        function log() {
            try { console.log.apply(console, ['[CooopShare]'].concat(Array.prototype.slice.call(arguments))); } catch(e) {}
        }

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = 'cs-status' + (cls ? ' ' + cls : '');
        }

        function setProgress(pct) {
            if (pct <= 0) {
                progressEl.classList.remove('active');
                progressBarEl.style.width = '0%';
            } else {
                progressEl.classList.add('active');
                progressBarEl.style.width = Math.min(100, pct) + '%';
            }
        }

        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function parseHash(hash) {
            if (!hash) return null;
            let payload = hash.replace(/^#/, '');
            if (payload.indexOf('room=') === -1) return null;
            const parts = payload.split('&');
            const obj = {};
            for (const p of parts) {
                const idx = p.indexOf('=');
                if (idx === -1) continue;
                const key = p.substring(0, idx);
                const val = p.substring(idx + 1);
                obj[key] = decodeURIComponent(val);
            }
            if (!obj.room) return null;
            return obj;
        }

        function openSignaling(roomId) {
            return new Promise(function(resolve, reject) {
                try {
                    const url = SIGNAL_URL + '?room=' + encodeURIComponent(roomId) + '&role=guest';
                    const ws = new WebSocket(url);
                    let opened = false;
                    const timeout = setTimeout(function() {
                        if (!opened) {
                            try { ws.close(); } catch(e) {}
                            reject(new Error('Сигнальный сервер не отвечает'));
                        }
                    }, 8000);
                    ws.onopen = function() {
                        opened = true;
                        clearTimeout(timeout);
                        resolve(ws);
                    };
                    ws.onerror = function() {
                        if (!opened) {
                            clearTimeout(timeout);
                            reject(new Error('Ошибка подключения к сигнальному серверу'));
                        }
                    };
                    ws.onclose = function() {
                        if (!opened) {
                            clearTimeout(timeout);
                            reject(new Error('Соединение закрыто'));
                        }
                    };
                } catch(e) {
                    reject(e);
                }
            });
        }

        function startPeer(roomId, onOffer) {
            pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

            pc.onicecandidate = function(e) {
                if (e.candidate && socket && socket.readyState === 1) {
                    try {
                        socket.send(JSON.stringify({
                            type: 'signal',
                            data: e.candidate
                        }));
                    } catch(err) {}
                }
            };

            pc.ondatachannel = function(event) {
                attachDataChannel(event.channel);
            };

            pc.onconnectionstatechange = function() {
                const state = pc.connectionState;
                log('connection', state);
                if (state === 'failed' || state === 'disconnected' || state === 'closed') {
                    if (!finished) {
                        setStatus('Соединение разорвано', 'error');
                    }
                }
            };
        }

        function attachDataChannel(channel) {
            dc = channel;
            dc.binaryType = 'arraybuffer';

            dc.onopen = function() {
                log('guest DC open');
                connected = true;
                setStatus('Получение файла...');
                setProgress(1);
            };

            dc.onmessage = function(event) {
                const data = event.data;
                if (typeof data === 'string') {
                    let msg;
                    try { msg = JSON.parse(data); } catch(e) { return; }
                    if (msg.done) {
                        finishDownload();
                        return;
                    }
                    if (msg.name) {
                        expectedMeta = msg;
                        nameEl.textContent = msg.name;
                        metaEl.innerHTML = 'Размер: <b>' + formatSize(msg.size) + '</b> • Тип: <b>' + (msg.type || 'application/octet-stream') + '</b>';
                    }
                    return;
                }
                if (data instanceof ArrayBuffer) {
                    receivedChunks.push(new Uint8Array(data));
                    receivedBytes += data.byteLength;
                    if (expectedMeta && expectedMeta.size > 0) {
                        const pct = Math.min(99, Math.round((receivedBytes / expectedMeta.size) * 100));
                        setProgress(pct);
                        setStatus('Получено: ' + formatSize(receivedBytes) + ' из ' + formatSize(expectedMeta.size));
                    } else {
                        setStatus('Получено: ' + formatSize(receivedBytes));
                    }
                }
            };

            dc.onclose = function() {
                log('guest DC closed');
                if (!finished) {
                    setStatus('Раздающий отключился', 'error');
                }
            };

            dc.onerror = function(e) {
                log('guest DC error', e);
            };
        }

        function finishDownload() {
            if (finished) return;
            finished = true;
            setProgress(100);

            let total = 0;
            for (const c of receivedChunks) total += c.length;
            const merged = new Uint8Array(total);
            let off = 0;
            for (const c of receivedChunks) {
                merged.set(c, off);
                off += c.length;
            }
            receivedChunks = [];

            const mime = (expectedMeta && expectedMeta.type) || 'application/octet-stream';
            finalBlob = new Blob([merged], { type: mime });

            setStatus('Файл готов к скачиванию', 'success');
            downloadBtn.disabled = false;
            hintEl.textContent = 'Нажмите кнопку, чтобы сохранить файл.';
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
                URL.revokeObjectURL(url);
                if (a.parentNode) a.parentNode.removeChild(a);
            }, 800);
        }

        async function connect() {
            setStatus('Подключение к сигнальному серверу...');
            setProgress(5);

            let ws;
            try {
                ws = await openSignaling(params.room);
            } catch(e) {
                setStatus(e.message || 'Сигнальный сервер недоступен', 'error');
                setProgress(0);
                return;
            }
            socket = ws;

            startPeer(params.room);

            setStatus('Ожидание раздающего...');
            setProgress(10);

            ws.onmessage = async function(event) {
                let msg;
                try { msg = JSON.parse(event.data); } catch(e) { return; }
                if (!msg || !msg.type) return;

                if (msg.type === 'signal') {
                    const data = msg.data;
                    if (!data) return;
                    try {
                        if (data.type === 'offer') {
                            await pc.setRemoteDescription(new RTCSessionDescription(data));
                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(answer);
                            ws.send(JSON.stringify({ type: 'signal', data: pc.localDescription }));
                            setStatus('Установка соединения...');
                            setProgress(15);
                        } else if (data.type === 'answer') {
                            await pc.setRemoteDescription(new RTCSessionDescription(data));
                        } else if (data.candidate !== undefined) {
                            try { await pc.addIceCandidate(data); } catch(e) {}
                        }
                    } catch(e) {
                        log('signal error', e);
                    }
                } else if (msg.type === 'host-left') {
                    if (!finished) {
                        setStatus('Раздающий отключился', 'error');
                    }
                }
            };

            ws.onclose = function() {
                log('signaling closed');
            };
        }

        function init() {
            const hash = location.hash;
            params = parseHash(hash);

            if (!params || !params.room) {
                nameEl.textContent = 'Ошибка';
                metaEl.textContent = 'Ссылка не содержит данных Cooop';
                setStatus('Ссылка повреждена или недействительна', 'error');
                hintEl.style.display = 'none';
                return;
            }

            nameEl.textContent = params.name || 'Файл';
            if (params.size) {
                metaEl.innerHTML = 'Размер: <b>' + formatSize(parseInt(params.size, 10) || 0) + '</b> • Тип: <b>' + (params.mime || 'application/octet-stream') + '</b>';
            } else {
                metaEl.textContent = 'Ожидание метаданных...';
            }

            connect();

            downloadBtn.addEventListener('click', function() {
                if (!finalBlob) return;
                triggerDownload(finalBlob, params.name || 'file');
                setStatus('Файл сохранён', 'success');
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
