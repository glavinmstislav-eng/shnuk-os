<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cooop Share</title>
    <style>
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'TTPaplane', monospace;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            color: #1a1a1a;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .cs-wrap {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
        }

        .cs-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cs-logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #cc0000;
        }

        .cs-title {
            font-size: 14px;
            color: #666666;
            letter-spacing: 0.5px;
        }

        .cs-card {
            border: 2px solid #e0e0e0;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cs-file-name {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            word-break: break-all;
            line-height: 1.3;
        }

        .cs-file-meta {
            font-size: 13px;
            color: #666666;
            line-height: 1.5;
        }

        .cs-file-meta b {
            color: #1a1a1a;
            font-weight: 700;
        }

        .cs-status {
            font-size: 13px;
            color: #666666;
            min-height: 18px;
            line-height: 1.5;
            word-break: break-word;
        }

        .cs-status.error {
            color: #cc0000;
        }

        .cs-status.success {
            color: #2e7d32;
        }

        .cs-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: none;
            background: #cc0000;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .cs-btn:hover {
            background: #990000;
        }

        .cs-btn:disabled {
            background: #999999;
            cursor: not-allowed;
        }

        .cs-progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            overflow: hidden;
            display: none;
        }

        .cs-progress.active {
            display: block;
        }

        .cs-progress-bar {
            height: 100%;
            width: 0%;
            background: #cc0000;
            transition: width 0.3s ease;
        }

        .cs-hint {
            font-size: 12px;
            color: #888888;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            body { padding: 20px 16px; }
            .cs-logo { font-size: 24px; }
            .cs-file-name { font-size: 16px; }
            .cs-card { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="cs-wrap">
        <div class="cs-header">
            <div class="cs-logo">Cooop</div>
            <div class="cs-title">Поделиться файлом</div>
        </div>

        <div class="cs-card">
            <div class="cs-file-name" id="csFileName">—</div>
            <div class="cs-file-meta" id="csFileMeta">Ожидание данных...</div>
            <div class="cs-progress" id="csProgress">
                <div class="cs-progress-bar" id="csProgressBar"></div>
            </div>
            <div class="cs-status" id="csStatus"></div>
        </div>

        <button class="cs-btn" id="csDownloadBtn" disabled>СКАЧАТЬ ФАЙЛ</button>

        <div class="cs-hint" id="csHint">
            Файл будет распакован и сохранён в папку загрузок браузера.
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const nameEl = document.getElementById('csFileName');
        const metaEl = document.getElementById('csFileMeta');
        const statusEl = document.getElementById('csStatus');
        const progressEl = document.getElementById('csProgress');
        const progressBarEl = document.getElementById('csProgressBar');
        const downloadBtn = document.getElementById('csDownloadBtn');
        const hintEl = document.getElementById('csHint');

        let parsed = null;

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = 'cs-status' + (cls ? ' ' + cls : '');
        }

        function setProgress(pct) {
            if (pct <= 0) {
                progressEl.classList.remove('active');
                progressBarEl.style.width = '0%';
            } else {
                progressEl.classList.add('active');
                progressBarEl.style.width = Math.min(100, pct) + '%';
            }
        }

        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function base64UrlDecode(str) {
            let b64 = String(str).replace(/\s+/g, '');
            b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function rleDecode(bytes) {
            const out = [];
            let i = 0;
            const n = bytes.length;
            while (i < n) {
                const b = bytes[i];
                if (b === 0xFF) {
                    if (i + 2 >= n) break;
                    const count = bytes[i + 1];
                    const val = bytes[i + 2];
                    if (count === 0) {
                        out.push(0xFF);
                    } else {
                        for (let k = 0; k < count; k++) out.push(val);
                    }
                    i += 3;
                } else {
                    out.push(b);
                    i++;
                }
            }
            return new Uint8Array(out);
        }

        async function decompressBytes(bytes) {
            if (typeof DecompressionStream === 'undefined') return null;
            const types = ['deflate-raw', 'deflate', 'gzip'];
            for (const t of types) {
                try {
                    const ds = new DecompressionStream(t);
                    const writer = ds.writable.getWriter();
                    writer.write(bytes);
                    writer.close();

                    const reader = ds.readable.getReader();
                    const chunks = [];
                    let total = 0;
                    while (true) {
                        const r = await reader.read();
                        if (r.done) break;
                        chunks.push(r.value);
                        total += r.value.length;
                    }
                    const out = new Uint8Array(total);
                    let off = 0;
                    for (const c of chunks) {
                        out.set(c, off);
                        off += c.length;
                    }
                    return out;
                } catch(e) {
                    continue;
                }
            }
            return null;
        }

        async function unpackFile(bytes, method) {
            const tryOrder = [method, 'dr', 'd', 'r', 'n'];

            for (const m of tryOrder) {
                try {
                    let data = bytes;

                    if (m === 'r' || m === 'dr') {
                        data = rleDecode(data);
                    }
                    if (m === 'd' || m === 'dr') {
                        const dec = await decompressBytes(data);
                        if (!dec) continue;
                        data = dec;
                    }
                    if (data && data.length > 0) return data;
                } catch(e) {
                    continue;
                }
            }
            return null;
        }

        function parseLink(hash) {
            if (!hash) return null;
            const idx = hash.indexOf('#cooop=');
            if (idx === -1) return null;
            let payload = hash.substring(idx + 7);
            payload = payload.replace(/\s+/g, '');
            const parts = payload.split('|');
            if (parts.length !== 4) return null;
            try {
                return {
                    name: decodeURIComponent(parts[0]),
                    mime: decodeURIComponent(parts[1]),
                    method: parts[2],
                    b64: parts[3]
                };
            } catch(e) {
                return null;
            }
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
                URL.revokeObjectURL(url);
                if (a.parentNode) a.parentNode.removeChild(a);
            }, 800);
        }

        async function unpackAndPrepare() {
            if (!parsed) return;

            setProgress(10);
            setStatus('Распаковка...');

            let packedBytes;
            try {
                packedBytes = base64UrlDecode(parsed.b64);
            } catch(e) {
                setStatus('Не удалось декодировать base64: ' + e.message, 'error');
                setProgress(0);
                return;
            }

            setProgress(40);
            let unpacked;
            try {
                unpacked = await unpackFile(packedBytes, parsed.method);
            } catch(e) {
                setStatus('Ошибка распаковки: ' + e.message, 'error');
                setProgress(0);
                return;
            }

            if (!unpacked || unpacked.length === 0) {
                setStatus('Не удалось распаковать файл', 'error');
                setProgress(0);
                return;
            }

            setProgress(100);
            const blob = new Blob([unpacked], { type: parsed.mime });
            metaEl.innerHTML =
                'Размер: <b>' + formatSize(unpacked.length) + '</b> • ' +
                'Тип: <b>' + parsed.mime + '</b>';
            hintEl.textContent = 'Файл готов к скачиванию.';

            downloadBtn.disabled = false;
            downloadBtn.onclick = function() {
                triggerDownload(blob, parsed.name);
                setStatus('Файл скачан', 'success');
            };

            setStatus('Файл готов', 'success');
        }

        function init() {
            const hash = location.hash;
            parsed = parseLink(hash);

            if (!parsed) {
                nameEl.textContent = 'Ошибка';
                metaEl.textContent = 'Ссылка не содержит данных Cooop';
                setStatus('Убедитесь, что ссылка содержит #cooop=', 'error');
                hintEl.style.display = 'none';
                return;
            }

            nameEl.textContent = parsed.name;
            metaEl.textContent = 'Готовим распаковку...';
            setStatus('Подготовка...');

            unpackAndPrepare();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
