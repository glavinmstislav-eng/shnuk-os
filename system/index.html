<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; frame-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Shnuk OS</title>
    <style>
        :root {
            --livebar-h: 44px;
            --accent: #cc0000;
            --accent-dark: #990000;
            --text-on-accent: #ffffff;
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f0f0f0;
            --bg-hover: #fff5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --header-bg: #f5f5f5;
            --header-text: #1a1a1a;
            --livebar-bg: #ffffff;
            --livebar-text: #1a1a1a;
            --panel-bg: rgba(255, 255, 255, 0.85);

            --desktop-cols: 4;
            --desktop-rows: 2;
            --apps-cols: 4;
            --apps-rows: 3;

            --search-btn-size: 40px;
            --search-btn-offset: 8px;

            --dock-h: 0px;
        }
        html.pc-mode {
            --dock-h: 64px;
            --livebar-h: 0px;
        }

        [data-theme="evening"] {
            --accent: #cc0000;
            --accent-dark: #990000;
            --text-on-accent: #ffffff;
            --bg-primary: #2a2a2a;
            --bg-secondary: #333333;
            --bg-tertiary: #3a3a3a;
            --bg-hover: #3a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #999999;
            --border-color: #444444;
            --header-bg: #333333;
            --header-text: #ffffff;
            --livebar-bg: #2a2a2a;
            --livebar-text: #ffffff;
            --panel-bg: rgba(42, 42, 42, 0.9);
        }

        [data-theme="warm-night"] {
            --accent: #ffe066;
            --accent-dark: #e6c94d;
            --text-on-accent: #000000;
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --bg-hover: #1a1a00;
            --text-primary: #ffffff;
            --text-secondary: #dddddd;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --header-bg: #ffe066;
            --header-text: #000000;
            --livebar-bg: #000000;
            --livebar-text: #ffffff;
            --panel-bg: rgba(0, 0, 0, 0.9);
        }

        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'TTPaplane';
            src: url('TT_Paplane_Trial_Regular.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'TTPaplane', monospace;
        }

        html, body {
            width: 100%; height: 100%;
            font-family: 'TTPaplane', monospace, sans-serif;
            font-size: 20px;
            touch-action: none; overflow: hidden;
            background: var(--bg-primary);
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            transition: background 0.4s ease, color 0.4s ease;
        }

        html, body, html *, body * {
            cursor: url('cursor.png') 4 4, auto !important;
        }

        html ::-webkit-scrollbar,
        body ::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            cursor: url('cursor.png') 4 4, auto !important;
        }
        html ::-webkit-scrollbar-thumb,
        body ::-webkit-scrollbar-thumb,
        html::-webkit-scrollbar-thumb,
        body::-webkit-scrollbar-thumb {
            cursor: url('cursor.png') 4 4, auto !important;
        }
        html ::-webkit-scrollbar-track,
        body ::-webkit-scrollbar-track,
        html::-webkit-scrollbar-track,
        body::-webkit-scrollbar-track {
            cursor: url('cursor.png') 4 4, auto !important;
        }
        html ::-webkit-scrollbar-corner,
        body ::-webkit-scrollbar-corner,
        html::-webkit-scrollbar-corner,
        body::-webkit-scrollbar-corner {
            cursor: url('cursor.png') 4 4, auto !important;
        }
        html ::-webkit-scrollbar-button,
        body ::-webkit-scrollbar-button,
        html::-webkit-scrollbar-button,
        body::-webkit-scrollbar-button {
            cursor: url('cursor.png') 4 4, auto !important;
        }

        html.locked-no-livebar #liveBar,
        html.locked-no-livebar #liveBarShade {
            display: none !important;
        }

        #osSplash {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 2147483647;
            overflow: hidden;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        #osSplash.hidden {
            opacity: 0;
        }
        #osSplash video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: block;
            background: #000000;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        #osApp { display: none; position: relative; width: 100%; height: 100%; overflow: hidden; }
        #osApp.visible { display: block; }

        .app-background {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease, filter 0.35s ease, transform 0.35s ease, background-color 0.4s ease;
            z-index: 0;
            overflow: hidden;
            background-color: var(--bg-primary);
            touch-action: none;
        }
        .app-background.white-bg { background: var(--bg-primary) !important; transform: none !important; }
        .app-background.blurred { filter: blur(30px); transform: scale(1.15); }

        .top-panel {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            display: flex;
            flex-direction: column;
            padding: 0 20px 24px 20px;
            background: transparent;
            z-index: 5;
            transition: opacity 0.35s ease, background 0.25s ease;
            will-change: opacity;
            pointer-events: none;
        }
        .top-panel .button-group,
        .top-panel .desktop-search { pointer-events: auto; }
        .top-panel.swiped-down { opacity: 0; pointer-events: none; }
        .top-panel.editing { background: var(--panel-bg); pointer-events: auto; }

        .edit-title {
            position: absolute;
            top: 24px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 15;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .top-panel.editing .edit-title {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .edit-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--text-primary);
            font-family: 'TTPaplane', monospace;
            font-size: 30px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
            z-index: 16;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .top-panel.editing .edit-close {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .edit-close:hover { color: var(--accent); }
        .edit-close:active { transform: scale(0.9); }

        .button-group {
            display: grid;
            grid-template-columns: repeat(var(--desktop-cols, 4), 1fr);
            grid-auto-rows: minmax(80px, auto);
            justify-items: center;
            align-items: center;
            gap: 20px 24px;
            max-width: 620px;
            width: 100%;
            margin: auto auto 0 auto;
            padding: 10px 0 0;
            touch-action: none;
            z-index: 3;
        }

        .btn-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .btn {
            width: 100%; height: 100%;
            background: transparent !important; border: none; cursor: grab;
            box-shadow: none !important; outline: none !important;
            transition: transform 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
            -webkit-tap-highlight-color: transparent; touch-action: none;
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 0; overflow: visible; border-radius: 0;
        }
        .btn img { width: 100%; height: 100%; object-fit: contain; display: block; z-index: 1; position: relative; pointer-events: none; }
        .btn.dragging { cursor: grabbing; transform: scale(1.12); z-index: 1000; opacity: 0.92; filter: blur(0.5px); }
        .btn.editable { cursor: grab; }
        .button-group.edit-mode .btn:not(.dragging) { animation: wiggle 1.2s ease-in-out infinite; }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(2deg); }
            30% { transform: rotate(-2deg); }
            45% { transform: rotate(1.5deg); }
            60% { transform: rotate(-1.5deg); }
            75% { transform: rotate(0.5deg); }
            90% { transform: rotate(-0.5deg); }
        }
        .btn:active { transform: scale(0.94); filter: blur(0.5px); }

        .search-highlight {
            animation: searchHighlightPulse 1s ease;
        }
        @keyframes searchHighlightPulse {
            0% { box-shadow: 0 0 0 0 var(--accent); }
            20% { box-shadow: 0 0 0 6px rgba(204,0,0,0.45); }
            60% { box-shadow: 0 0 0 10px rgba(204,0,0,0.15); }
            100% { box-shadow: 0 0 0 0 rgba(204,0,0,0); }
        }

        .btn-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 24px;
            height: 24px;
            background: var(--accent);
            color: var(--text-on-accent);
            border: 2px solid var(--bg-primary);
            border-radius: 50%;
            font-size: 15px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            font-family: 'TTPaplane', monospace;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.6);
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-tap-highlight-color: transparent;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-group.edit-mode .btn-remove {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .btn-remove:active { transform: scale(0.85); }

        .desktop-search {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding-top: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            z-index: 4;
            position: relative;
        }
        .desktop-search .search-input-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .desktop-search input {
            width: 100%;
            padding: 14px calc(var(--search-btn-size) + var(--search-btn-offset) * 2) 14px 22px;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            background: var(--panel-bg);
            color: var(--text-primary);
            font-family: 'TTPaplane', monospace;
            font-size: 17px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            min-height: calc(var(--search-btn-size) + var(--search-btn-offset) * 2 + 4px);
            line-height: 1.2;
        }
        .desktop-search input:focus { border-color: var(--accent); }
        .desktop-search input::placeholder { color: var(--text-muted); }

        .search-submit {
            position: absolute;
            top: 50%;
            right: var(--search-btn-offset);
            transform: translateY(-50%) scale(0.6);
            width: var(--search-btn-size);
            height: var(--search-btn-size);
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: var(--text-on-accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .search-submit.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }
        .search-submit:hover { background: var(--accent-dark); }
        .search-submit:active { transform: translateY(-50%) scale(0.9); }
        .search-submit svg {
            width: 18px;
            height: 18px;
            display: block;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin: 0;
            padding: 0;
            position: static;
            transform: none;
        }

        .bottom-panel {
            position: absolute;
            top: var(--livebar-h, 44px); left: 0;
            width: 100%; height: calc(100% - var(--livebar-h, 44px));
            z-index: 1;
            overflow-y: auto; overflow-x: hidden;
            padding: 30px 20px 200px;
            display: flex; flex-direction: column; align-items: center;
            -webkit-overflow-scrolling: touch;
            opacity: 0; pointer-events: none;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            will-change: opacity, transform;
            transform: scale(1.05);
            transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.4s ease;
        }
        .bottom-panel.visible { opacity: 1; pointer-events: all; transform: scale(1); }

        .bottom-panel.closing {
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.4s ease;
        }

        .bottom-panel .bottom-blur {
            position: fixed;
            left: 0;
            right: 0;
            bottom: var(--dock-h, 0px);
            height: 110px;
            pointer-events: none;
            z-index: 22;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            -webkit-mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
            mask-image: linear-gradient(to top, #000 0%, #000 40%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .bottom-panel.visible .bottom-blur { opacity: 1; }

        .bottom-panel .close-apps {
            position: absolute; top: 16px; right: 20px;
            width: 40px;
            height: 40px;
            padding: 0;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-family: 'TTPaplane', monospace;
            font-size: 30px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            transition: color 0.2s ease, transform 0.15s ease;
        }
        .bottom-panel .close-apps:hover { color: var(--accent); }
        .bottom-panel .close-apps:active { transform: scale(0.9); }

        .bottom-panel h2 {
            font-size: 26px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 24px; letter-spacing: -0.3px;
            z-index: 3;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(var(--apps-cols, 4), 1fr);
            grid-auto-rows: minmax(0, auto);
            gap: 20px 16px;
            max-width: 520px; width: 100%;
            z-index: 3;
            position: relative;
        }

        .icon-item {
            aspect-ratio: 1 / 1;
            background: transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.2s ease; cursor: pointer;
            padding: 6px;
            border: none; outline: none;
            max-width: 90px; max-height: 90px;
            justify-self: center; width: 100%;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            opacity: 1;
            transform: none;
        }
        .bottom-panel.visible .icon-item {
            animation: iconRise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes iconRise {
            from { opacity: 0; transform: translateY(28px); filter: blur(8px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }
        .icon-item:active { transform: scale(0.9); }
        .icon-item img { width: 80%; height: 80%; object-fit: contain; }
        .icon-item .icon-label {
            font-size: 13px; color: var(--text-primary); margin-top: 2px;
            text-align: center; line-height: 1.2;
            font-family: 'TTPaplane', monospace;
        }
        .icon-item .icon-default { font-size: 40px; line-height: 1; color: var(--text-primary); }
        .icon-item.html-app::after {
            content: 'HTML'; position: absolute; top: 0; left: 0;
            font-size: 10px; background: #4488ff; color: #fff;
            padding: 1px 5px; border-radius: 2px;
            font-weight: 700; letter-spacing: 0.5px;
        }

        .apps-search-bar {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            bottom: calc(20px + var(--dock-h, 0px));
            width: calc(100% - 40px);
            max-width: 620px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 60;
            box-sizing: border-box;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .apps-search-bar.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .apps-search-bar .search-input-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .apps-search-bar input {
            width: 100%;
            padding: 14px calc(var(--search-btn-size) + var(--search-btn-offset) * 2) 14px 22px;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'TTPaplane', monospace;
            font-size: 17px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
            min-height: calc(var(--search-btn-size) + var(--search-btn-offset) * 2 + 4px);
            line-height: 1.2;
        }
        .apps-search-bar input:focus { border-color: var(--accent); }
        .apps-search-bar input::placeholder { color: var(--text-muted); }
        .apps-search-bar .search-submit {
            background: var(--accent);
            color: var(--text-on-accent);
        }
        .apps-search-bar .search-submit:hover { background: var(--accent-dark); }

        .add-desktop-btn {
            position: fixed;
            left: 50%;
            bottom: calc(84px + var(--dock-h, 0px));
            transform: translateX(-50%) translateY(20px);
            padding: 14px 26px;
            border: none;
            background: var(--accent);
            color: var(--text-on-accent);
            font-family: 'TTPaplane', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.6px;
            cursor: pointer;
            z-index: 65;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s;
            box-shadow: 0 10px 30px rgba(204,0,0,0.4);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .add-desktop-btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .add-desktop-btn:hover { background: var(--accent-dark); }
        .add-desktop-btn:active { transform: translateX(-50%) translateY(0) scale(0.96); }

        .picker-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            z-index: 2147483600;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease, backdrop-filter 0.3s ease, background 0.3s ease;
        }
        .picker-backdrop.visible {
            opacity: 1;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .picker-modal {
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
            font-family: 'TTPaplane', monospace;
            border-radius: 0;
        }
        .picker-backdrop.visible .picker-modal {
            transform: scale(1) translateY(0);
        }
        .picker-header {
            display: flex;
            justify-content: space-between;

<body>

        </div>

                <input type="text" id="appsSearchInput" placeholder="Поиск приложений..." autocomplete="off" tabindex="-1" />
                <button class="search-submit visible" id="appsSearchBtn" aria-label="Найти" tabindex="-1">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
                </button>
            </div>

    <script>
    (function() {
        'use strict';

        setTimeout(function() {
            try {
                if (window.history && window.history.replaceState) {
                    window.history.replaceState(null, '', window.location.pathname);
                }
            } catch(e) {}
        }, 1000);

        const osApp = document.getElementById('osApp');
        const osSplash = document.getElementById('osSplash');

        let splashHidden = false;

        function hideSplash() {
            if (splashHidden) return;
            splashHidden = true;
            if (!osSplash) return;
            osSplash.classList.add('hidden');
            setTimeout(function() {
                if (osSplash.parentNode) osSplash.parentNode.removeChild(osSplash);
            }, 900);
        }

        function hideSplashInstant() {
            if (splashHidden) return;
            splashHidden = true;
            if (!osSplash) return;
            osSplash.style.display = 'none';
            if (osSplash.parentNode) osSplash.parentNode.removeChild(osSplash);
        }

        window.__hideSplash = hideSplash;

        function armVideo() {
            if (!osSplash) {
                setTimeout(hideSplash, 500);
                return;
            }

            const splashVideo = document.createElement('video');
            splashVideo.id = 'osSplashVideo';
            splashVideo.src = 'start.mp4';
            splashVideo.muted = true;
            splashVideo.playsInline = true;
            splashVideo.setAttribute('playsinline', '');
            splashVideo.setAttribute('webkit-playsinline', '');
            splashVideo.preload = 'auto';
            osSplash.appendChild(splashVideo);

            let ended = false;

            function finish() {
                if (ended) return;
                ended = true;
                try { splashVideo.pause(); } catch(e) {}
                hideSplash();
            }

            splashVideo.addEventListener('ended', finish);
            splashVideo.addEventListener('error', function() {
                setTimeout(finish, 400);
            });

            function tryPlay() {
                const p = splashVideo.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function() {
                        const kick = function() {
                            try {
                                const q = splashVideo.play();
                                if (q && typeof q.catch === 'function') q.catch(function() {});
                            } catch(e) {}
                            document.removeEventListener('click', kick);
                            document.removeEventListener('touchstart', kick);
                            document.removeEventListener('keydown', kick);
                        };
                        document.addEventListener('click', kick, { once: true });
                        document.addEventListener('touchstart', kick, { once: true });
                        document.addEventListener('keydown', kick, { once: true });
                    });
                }
            }

            tryPlay();

            setTimeout(function() {
                if (!ended) {
                    if (splashVideo.readyState < 2 || splashVideo.paused) {
                        finish();
                    }
                }
            }, 15000);
        }

        function loadScriptWithFallback(src) {
            return new Promise(function(resolve) {
                const timeoutId = setTimeout(function() {
                    resolve(false);
                }, 20000);

                const script = document.createElement('script');
                script.src = src + '?t=' + Date.now();
                script.async = false;
                script.onload = function() {
                    clearTimeout(timeoutId);
                    resolve(true);
                };
                script.onerror = function() {
                    clearTimeout(timeoutId);
                    resolve(false);
                };
                document.head.appendChild(script);
            });
        }

        function waitForOSStorage() {
            return new Promise(function(resolve) {
                if (window.OSStorage) { resolve(true); return; }
                let tries = 0;
                const iv = setInterval(function() {
                    tries++;
                    if (window.OSStorage || tries > 50) {
                        clearInterval(iv);
                        resolve(!!window.OSStorage);
                    }
                }, 100);
            });
        }

        let liveBarObserver = null;

        function hideLiveBarForLock() {
            document.documentElement.classList.add('locked-no-livebar');
            if (liveBarObserver) return;
            liveBarObserver = new MutationObserver(function(mutations) {
                for (const m of mutations) {
                    for (const node of m.addedNodes) {
                        if (node && node.nodeType === 1) {
                            if (node.id === 'liveBar' || node.id === 'liveBarShade') {
                                node.style.display = 'none';
                            }
                            if (node.querySelector) {
                                const lb = node.querySelector('#liveBar, #liveBarShade');
                                if (lb) lb.style.display = 'none';
                            }
                        }
                    }
                }
            });
            if (document.body) {
                liveBarObserver.observe(document.body, { childList: true, subtree: true });
            }
        }

        function showLiveBarAfterLock() {
            document.documentElement.classList.remove('locked-no-livebar');
            if (liveBarObserver) {
                liveBarObserver.disconnect();
                liveBarObserver = null;
            }
            const barEl = document.getElementById('liveBar');
            if (barEl) barEl.style.display = '';
            const shadeEl = document.getElementById('liveBarShade');
            if (shadeEl) shadeEl.style.display = '';
        }

        const MIN_SCRIPTS = [
            'l10n.js',
            'l.js',
            'windows.js',
            'security.js',
            'shnuk-pc-mode.js'
        ];

        const REST_SCRIPTS = [
            'system-v.js',
            'shnuk-account.js',
            'onboarding.js',
            'live-bar.js',
            'app-scanner.js',
            'store.js',
            'settings.js',
            'cooop.js',
            'my-shnuk.js',
            'audio.js'
        ];

        const loadedScripts = Object.create(null);

        async function loadScriptsSequentially(list) {
            for (let i = 0; i < list.length; i++) {
                const src = list[i];
                if (loadedScripts[src]) continue;
                const ok = await loadScriptWithFallback(src);
                loadedScripts[src] = true;
                if (!ok) {
                    console.warn('[OS] Не удалось загрузить скрипт:', src);
                }
            }
        }

        async function launchOS() {
            osApp.classList.add('visible');
            osApp.style.display = 'block';

            try {
                if (localStorage.getItem('shnuk_blur_disabled') === 'true') {
                    document.documentElement.classList.add('no-blur');
                }
            } catch(e) {}

            await waitForOSStorage();

            await loadScriptsSequentially(MIN_SCRIPTS);

            let onPC = false;
            try {
                if (window.ShnukPCMode && typeof window.ShnukPCMode.isPC === 'function') {
                    onPC = window.ShnukPCMode.isPC();
                }
            } catch(e) {}

            if (onPC) {
                document.documentElement.classList.add('pc-mode');
                hideSplashInstant();
            } else {
                armVideo();
            }

            let hasSec = false;
            try {
                if (window.Security && typeof window.Security.hasSecurityAsync === 'function') {
                    hasSec = await window.Security.hasSecurityAsync();
                }
            } catch(e) { hasSec = false; }

            const needLock = hasSec && !window.Security.isSessionUnlocked();

            if (needLock) {
                osApp.style.display = 'none';
                hideLiveBarForLock();

                await new Promise(function(resolve) {
                    setTimeout(function() {
                        window.Security.showLockScreen(function(unlocked) {
                            resolve(unlocked);
                        });
                    }, 50);
                });

                osApp.style.display = 'block';
                osApp.classList.add('visible');
                showLiveBarAfterLock();
            }

            await loadScriptsSequentially(REST_SCRIPTS);

            if (window.Security && typeof window.Security.checkStartWipe === 'function') {
                const didWipe = await window.Security.checkStartWipe();
                if (didWipe) return;
            }

            if (typeof window.initOS === 'function') window.initOS();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', launchOS);
        } else {
            launchOS();
        }
    })();
    </script>

    <script>

        const isPCMode = !!(window.ShnukPCMode && typeof window.ShnukPCMode.isPC === 'function' && window.ShnukPCMode.isPC());

                const modal = document.createElement('div');

                    max-width: 480px;
                    border: 3px solid #cc0000;

                    transform: scale(0.94);
                    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
                `;
                requestAnimationFrame(function() {
                    modal.style.transform = 'scale(1)';
                });

                const header = document.createElement('div');
                header.style.cssText = `
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding: 14px 18px;
                    background: #cc0000;
                    color: #ffffff;
                    border-bottom: 2px solid #990000;
                `;
                const icon = document.createElement('div');
                icon.textContent = '!';
                icon.style.cssText = `
                    width: 28px; height: 28px;
                    display: flex; align-items: center; justify-content: center;

        function matches(text, q) {
            if (!text) return false;

        async function searchPhotos(q, limit) {
            if (!window.SharedFiles) return [];
            try {
                if (window.SharedFiles.ready) await window.SharedFiles.ready();
                const all = window.SharedFiles.get() || [];
                const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'];
                const items = all.filter(function(f) {
                    if (f.isFolder) return false;
                    const ext = (f.extension || (f.name || '').split('.').pop() || '').toLowerCase();
                    if (imageExts.indexOf(ext) === -1) return false;
                    return matches(f.name, q);
                }).slice(0, limit || 10);
                return items.map(function(f) {
                    return { kind: 'photo', file: f, title: f.name };
                });
            } catch(e) { return []; }
        }

        async function searchFiles(q, limit) {
            if (!window.SharedFiles) return [];
            try {
                if (window.SharedFiles.ready) await window.SharedFiles.ready();
                const all = window.SharedFiles.get() || [];
                const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'];
                const items = all.filter(function(f) {
                    if (f.isFolder) return false;
                    const ext = (f.extension || (f.name || '').split('.').pop() || '').toLowerCase();
                    if (imageExts.indexOf(ext) !== -1) return false;
                    return matches(f.name, q);
                }).slice(0, limit || 10);
                return items.map(function(f) {
                    return { kind: 'file', file: f, title: f.name };
                });
            } catch(e) { return []; }
        }

        function searchNotifications(q, limit) {
            if (!window.LiveBar || typeof window.LiveBar.getNotifications !== 'function') return [];
            const list = window.LiveBar.getNotifications() || [];
            const found = list.filter(function(n) {
                return matches(n.title, q) || matches(n.body, q) || matches(n.appName, q);
            }).slice(0, limit || 10);
            return found.map(function(n) {
                return { kind: 'notification', notification: n, title: n.title || n.body || n.appName || '' };
            });
        }

        function searchLivebarActions(q, limit) {
            const list = [];
            if (!window.LiveBar || typeof window.LiveBar.get !== 'function') return list;
            const act = window.LiveBar.get();
            if (!act) return list;
            let text = '';
            if (act.type === 'recording') text = 'Запись ' + (act.appName || '');
            else if (act.type === 'stopwatch') text = 'Секундомер ' + (act.appName || '');
            else if (act.type === 'timer') text = 'Таймер ' + (act.appName || '');
            else if (act.type === 'alarm') text = 'Будильник ' + (act.appName || '');
            else if (act.type === 'cooop') text = 'Cooop ' + (act.appName || '');
            else if (act.type === 'custom') text = (act.payload && act.payload.text) || 'Действие';
            if (matches(text, q)) {
                list.push({ kind: 'livebar', activity: act, title: text });
            }
            return list.slice(0, limit || 5);
        }

        async function performAppsMenuSearch(query) {
            const q = (query || '').trim().toLowerCase();
            if (!q) {
                hideSearchResults();
                return;
            }

            const intel = loadSearchIntelligence();
            const results = [];

            const appsSorted = appsOrderSnapshot ? applyOrderSnapshot(allApps) : allApps;
            appsSorted.forEach(function(a) {
                if (matches(a.name, q)) {
                    results.push({ kind: 'app', app: a, title: a.name, sub: T('Программа') });
                }
            });

            if (intel.photos) {
                try {
                    const photos = await searchPhotos(q, 10);
                    photos.forEach(function(r) { r.sub = T('Фото'); results.push(r); });
                } catch(e) {}
            }

            if (intel.files) {
                try {
                    const files = await searchFiles(q, 10);
                    files.forEach(function(r) { r.sub = T('Файл'); results.push(r); });
                } catch(e) {}
            }

            if (intel.notifications) {
                try {
                    const notifs = searchNotifications(q, 10);
                    notifs.forEach(function(r) { r.sub = T('Уведомление'); results.push(r); });
                } catch(e) {}
            }

            if (intel.livebarActions) {
                try {
                    const acts = searchLivebarActions(q, 5);
                    acts.forEach(function(r) { r.sub = T('Действие'); results.push(r); });
                } catch(e) {}
            }

            searchResultsCache = results;
            renderSearchResults(results, q);
        }

        function renderSearchResults(results, q) {

            const order = ['app', 'photo', 'file', 'notification', 'livebar'];
            const groupTitles = {
                'app': T('Программы'),

                'file': T('Файлы'),
                'notification': T('Уведомления'),
                'livebar': T('Действия')

            order.forEach(function(kind) {
                const group = results.filter(function(r) { return r.kind === kind; });
                if (group.length === 0) return;

                const header = document.createElement('div');
                header.className = 'apps-search-group';
                header.textContent = groupTitles[kind];

        function buildSearchItem(r) {
            const item = document.createElement('div');
            item.className = 'apps-search-item';

            const iconWrap = document.createElement('div');
            iconWrap.className = 'apps-search-item-icon';

            if (r.kind === 'app') {
                if (r.app.icon) {
                    const img = document.createElement('img');
                    img.src = r.app.icon;
                    img.alt = r.app.name;
                    iconWrap.appendChild(img);
                } else {
                    iconWrap.textContent = (r.app.name || '?').charAt(0);
                }
            } else if (r.kind === 'photo') {
                if (r.file && r.file.data) {
                    const img = document.createElement('img');
                    img.src = r.file.data;
                    img.alt = r.file.name;
                    img.onerror = function() {
                        iconWrap.innerHTML = '';
                        iconWrap.textContent = 'IMG';
                    };
                    iconWrap.appendChild(img);
                } else {
                    iconWrap.textContent = 'IMG';
                }
            } else if (r.kind === 'file') {
                const ext = (r.file && r.file.extension) || (r.file && r.file.name && r.file.name.split('.').pop()) || '';
                iconWrap.textContent = (ext || 'F').substring(0, 3).toUpperCase();
            } else if (r.kind === 'notification') {
                iconWrap.textContent = '!';
            } else if (r.kind === 'livebar') {
                iconWrap.textContent = '>';
            }

            item.appendChild(iconWrap);

            const info = document.createElement('div');
            info.className = 'apps-search-item-info';

            const title = document.createElement('div');
            title.className = 'apps-search-item-title';
            title.textContent = r.title || '';
            info.appendChild(title);

            const sub = document.createElement('div');
            sub.className = 'apps-search-item-sub';
            sub.textContent = r.sub || '';
            info.appendChild(sub);

            item.appendChild(info);

            item.addEventListener('click', function() {
                hideSearchResults();
                appsSearchInput.value = '';
                openSearchResult(r);
            });

            return item;
        }

        async function openSearchResult(r) {
            if (!r) return;

            if (r.kind === 'app') {
                const appId = r.app.id;
                if (findOpenAppElement(appId)) return;
                window.__appOpenedFrom = 'menu';
                openAppWithAnimation(appId, null, true);
                return;
            }

            if (r.kind === 'photo' || r.kind === 'file') {
                const fileId = r.file.id;
                const parentId = r.file.parentId;
                if (typeof window.fileInit === 'function') {
                    window.fileInit();
                    setTimeout(function() {
                        window.dispatchEvent(new CustomEvent('shnuk:file-highlight', {
                            detail: { id: fileId, parentId: parentId }
                        }));
                    }, 350);
                }
                return;
            }

            if (r.kind === 'notification') {
                const n = r.notification;
                await openAppFromNotification(n);
                return;
            }

            if (r.kind === 'livebar') {
                const act = r.activity;
                if (act && act.appId && typeof window.ShnukOpenAppById === 'function') {
                    window.ShnukOpenAppById(act.appId, act.appName || null);
                }
                return;
            }
        }

        async function openAppFromNotification(n) {
            if (!n) return;

            window.__appOpenedFrom = 'notification';

            if (n.appName && window.__collarAppRegistry) {
                const reg = window.__collarAppRegistry;
                const entry = reg[n.appName];
                if (entry && typeof window.ShnukOpenAppById === 'function') {
                    window.__notificationOpenedAppId = entry.id;
                    try {
                        const ok = window.ShnukOpenAppById(entry.id);
                        if (ok) return;
                    } catch(e) {}
                }
            }

            if (n.appName && window.AppScanner && AppScanner.getApps) {
                try {
                    const apps = await AppScanner.getApps();
                    const found = apps.find(function(a) { return a.name === n.appName; });
                    if (found && typeof window.ShnukOpenAppById === 'function') {
                        window.__notificationOpenedAppId = found.id;
                        const ok = window.ShnukOpenAppById(found.id);
                        if (ok) return;
                    }
                } catch(e) {}
            }

            if (n.appId && typeof window.ShnukOpenAppById === 'function') {
                window.__notificationOpenedAppId = n.appId;
                try {
                    const ok = window.ShnukOpenAppById(n.appId);
                    if (ok) return;
                } catch(e) {}
            }

            if (n.appId) {
                window.__notificationOpenedAppId = n.appId;
                const initFns = [n.appId + 'Init', n.appId.replace(/-/g, '') + 'Init'];
                for (const fn of initFns) {
                    if (typeof window[fn] === 'function') {
                        try { window[fn](); return; } catch(e) {}
                    }
                }
            }

            if (n.appName) {
                const allIcons = document.querySelectorAll('.icon-item[data-app-id]');
                for (const el of allIcons) {
                    const name = el.dataset.appName || '';
                    if (name === n.appName) {
                        window.__notificationOpenedAppId = el.dataset.appId || null;
                        el.click();
                        return;
                    }
                }
            }
        }

                if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
                if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
                if (el.msRequestFullscreen) return el.msRequestFullscreen();
            } catch(e) {}

        function ensureFullscreen() {

                if (wantFullscreen) setTimeout(ensureFullscreen, 100);

        document.addEventListener('click', ensureFullscreen, { once: true });
