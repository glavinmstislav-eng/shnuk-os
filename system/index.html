                } catch(e) {}
            }
            applyTheme(themeId);
            appBackground.dataset.staticWallpaper = url;
            appBackground.style.backgroundImage = 'url(\'' + url + '\')';
        }

        window.addEventListener('shnuk:wallpaper-changed', function() { applyWallpaperFromStorage(); });
        window.addEventListener('shnuk:theme-changed', function() {
            let themeId = 'day';
            try { themeId = localStorage.getItem(THEME_KEY) || 'day'; } catch(e) {}
            applyTheme(themeId);
        });
        window.addEventListener('storage', function(e) {
            if (e.key === 'app_wallpaper') applyWallpaperFromStorage();
            if (e.key === THEME_KEY) {
                let themeId = 'day';
                try { themeId = localStorage.getItem(THEME_KEY) || 'day'; } catch(e) {}
                applyTheme(themeId);
            }
        });

        function getAppData(appId) { return allApps.find(a => a.id === appId); }
        function getAppIcon(appId) { const a = getAppData(appId); return a && a.icon ? a.icon : null; }
        function getAppName(appId) { const a = getAppData(appId); return a ? a.name : appId; }
        function makeOrderSnapshot() { appsOrderSnapshot = allApps.map(a => a.id); }
        function applyOrderSnapshot(apps) {
            if (!appsOrderSnapshot || appsOrderSnapshot.length === 0) return apps;
            const appMap = new Map();
            apps.forEach(a => appMap.set(a.id, a));
            const ordered = [];
            for (const id of appsOrderSnapshot) {
                if (appMap.has(id)) { ordered.push(appMap.get(id)); appMap.delete(id); }
            }
            for (const [, a] of appMap) ordered.push(a);
            return ordered;
        }

        function findOpenAppElement(appId) {
            const domId = APP_DOM_MAP[appId];
            if (domId) {
                const el = document.getElementById(domId);
                if (el && el.parentNode) return el;
            }
            const direct = document.getElementById(appId);
            if (direct && direct.parentNode) return direct;
            const guess = document.getElementById(appId + 'App');
            if (guess && guess.parentNode) return guess;
            const htmlWin = document.querySelector('.html-app-window[data-app-id="' + appId + '"]');
            if (htmlWin) return htmlWin;
            return null;
        }

        function closeAllApps(keepAppId) {
            const keys = Object.keys(APP_DOM_MAP);
            keys.forEach(function(key) {
                if (key === keepAppId) return;
                const domId = APP_DOM_MAP[key];
                const el = document.getElementById(domId);
                if (!el) return;

                const objName = APP_DESTROY_MAP[domId];
                if (objName && window[objName] && typeof window[objName].destroy === 'function') {
                    try {
                        window[objName].destroy();
                        return;
                    } catch(e) {}
                }

                try { if (el.parentNode) el.parentNode.removeChild(el); } catch(e) {}
            });
        }

        function bringToFront(el) {
            if (!el) return;
            try {
                const currentZ = parseInt(el.style.zIndex, 10) || 99999;
                el.style.zIndex = String(Math.max(currentZ, 99999) + 1);
            } catch(e) {}
        }

        function slideDownOut(targetEl, onDone) {
            if (!targetEl) { if (onDone) onDone(); return; }
            const rect = targetEl.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) { if (onDone) onDone(); return; }

            const distance = window.innerHeight - rect.top + 60;
            const duration = 320;
            const startTime = performance.now();

            targetEl.style.transformOrigin = 'center bottom';
            targetEl.style.willChange = 'transform, opacity, filter';
            targetEl.style.pointerEvents = 'none';
            targetEl.style.transition = 'none';

            function animate(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5
                    ? 4 * t * t * t
                    : 1 - Math.pow(-2 * t + 2, 3) / 2;
                const ty = distance * ease;
                const sc = 1 - 0.08 * ease;
                const blur = ease * 16;
                const opacity = 1 - Math.pow(t, 1.5);
                targetEl.style.transform = 'translateY(' + ty + 'px) scale(' + sc + ')';
                targetEl.style.opacity = String(opacity);
                targetEl.style.filter = 'blur(' + blur + 'px)';
                if (t < 1) requestAnimationFrame(animate);
                else {
                    if (targetEl.parentNode) targetEl.parentNode.removeChild(targetEl);
                    if (onDone) onDone();
                }
            }
            requestAnimationFrame(animate);
        }

        window.ShnukCloseAnimation = function(targetEl, appId, onDone) {
            if (!targetEl) { if (onDone) onDone(); return; }
            const startRect = targetEl.getBoundingClientRect();
            if (startRect.width === 0 || startRect.height === 0) { if (onDone) onDone(); return; }

            if (isPCMode) {
                try {
                    if (targetEl.parentNode) targetEl.parentNode.removeChild(targetEl);
                } catch(e) {}
                if (onDone) onDone();
                return;
            }

            const wasOpenedFromNotification = (appId && window.__notificationOpenedAppId === appId);

            slideDownOut(targetEl, function() {
                window.__appOpenedFrom = 'desktop';
                if (wasOpenedFromNotification) window.__notificationOpenedAppId = null;
                if (onDone) onDone();
            });
        };

        function openAppWithAnimation(appId, startRect, fromMenu) {
            if (window.__cooopGuestActive) {
                if (window.Win && window.Win.notify) window.Win.notify(T('В режиме Cooop приложения недоступны'), { type: 'info' });
                return;
            }
            const appData = getAppData(appId);
            if (!appData) return;

            if (isPCMode && window.PCWindows && window.PCWindows.isActive && window.PCWindows.isActive()) {
                if (appData.type === 'html') {
                    openHtmlAppPCMode(appData);
                    return;
                }

                const script = document.createElement('script');
                script.src = appData.file + '?t=' + Date.now();
                script.onload = function() {
                    if (typeof window[appData.id + 'Init'] === 'function') {
                        window[appData.id + 'Init']();
                    } else if (typeof window[appData.id.replace(/-/g, '') + 'Init'] === 'function') {
                        window[appData.id.replace(/-/g, '') + 'Init']();
                    }
                };
                document.head.appendChild(script);
                return;
            }

            const alreadyOpen = findOpenAppElement(appId);
            if (alreadyOpen) {
                return;
            }

            if (isAppAnimating) return;

            closeAllApps(appId);
            isAppAnimating = true;

            if (window.__appOpenedFrom !== 'notification') {
                window.__appOpenedFrom = fromMenu ? 'menu' : 'desktop';
            }

            let iconPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            let iconRect = null;
            if (startRect && (startRect.width > 0 || startRect.height > 0)) {
                iconPos = { x: startRect.left + startRect.width / 2, y: startRect.top + startRect.height / 2 };
                iconRect = { left: startRect.left, top: startRect.top, width: startRect.width, height: startRect.height };
            } else {
                const btn = document.querySelector('.btn[data-id="' + appId + '"]');
                if (btn) {
                    const r = btn.getBoundingClientRect();
                    if (r.width > 0 || r.height > 0) {
                        iconPos = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                        iconRect = { left: r.left, top: r.top, width: r.width, height: r.height };
                    }
                }
            }
            if (iconRect) lastOpenIconRects[appId] = iconRect;

            const backdrop = document.createElement('div');
            backdrop.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99998;background:rgba(0,0,0,0);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:all .3s cubic-bezier(.22,1,.36,1);pointer-events:none;';
            document.body.appendChild(backdrop);
            appBackground.classList.add('blurred');
            requestAnimationFrame(() => {
                backdrop.style.background = 'rgba(0,0,0,.5)';
                backdrop.style.backdropFilter = 'blur(20px)';
                backdrop.style.webkitBackdropFilter = 'blur(20px)';
            });

            const launchContainer = document.createElement('div');
            launchContainer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;pointer-events:none;';
            const flyIcon = document.createElement('div');
            flyIcon.style.cssText = `
                position:absolute;width:80px;height:80px;
                display:flex;align-items:center;justify-content:center;
                left:${iconPos.x - 40}px;top:${iconPos.y - 40}px;
                filter:blur(0px);opacity:1;
            `;
            const iconSrc = getAppIcon(appId);
            if (iconSrc) {
                const img = document.createElement('img');
                img.src = iconSrc;
                img.style.cssText = 'width:100%;height:100%;object-fit:contain;';
                flyIcon.appendChild(img);
            } else {
                flyIcon.textContent = getAppName(appId).charAt(0);
                flyIcon.style.cssText += 'font-size:32px;font-weight:bold;color:#fff;';
            }
            launchContainer.appendChild(flyIcon);
            document.body.appendChild(launchContainer);

            const startX = iconPos.x - 40;
            const startY = iconPos.y - 40;
            const endX = window.innerWidth / 2 - 60;
            const endY = window.innerHeight / 2 - 60;
            const duration = 380;
            const startTime = performance.now();

            function animateIcon(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const x = startX + (endX - startX) * ease;
                const y = startY + (endY - startY) * ease;
                const scale = 1 + progress * 0.5;
                const blur = progress * 15;
                flyIcon.style.left = x + 'px';
                flyIcon.style.top = y + 'px';
                flyIcon.style.transform = `scale(${scale})`;
                flyIcon.style.filter = `blur(${blur}px)`;
                flyIcon.style.opacity = 1 - progress * 0.5;
                if (progress < 1) requestAnimationFrame(animateIcon);
                else {
                    setTimeout(() => {
                        launchContainer.remove();
                        backdrop.style.opacity = '0';
                        setTimeout(() => backdrop.remove(), 300);
                        appBackground.classList.remove('blurred');
                        isAppAnimating = false;
                        if (appData.type === 'html') openHtmlApp(appData);
                        else {
                            const script = document.createElement('script');
                            script.src = appData.file + '?t=' + Date.now();
                            script.onload = function() {
                                if (typeof window[appData.id + 'Init'] === 'function') {
                                    window[appData.id + 'Init']();
                                } else if (typeof window[appData.id.replace(/-/g, '') + 'Init'] === 'function') {
                                    window[appData.id.replace(/-/g, '') + 'Init']();
                                }
                            };
                            document.head.appendChild(script);
                        }
                        if (fromMenu && !isPCMode && isBottomVisible) {
                            hideBottomPanel();
                        }
                    }, 100);
                }
            }
            requestAnimationFrame(animateIcon);
        }

        window.ShnukOpenAppById = function(appId, appName) {
            if (!appId && !appName) return false;

            let appData = null;
            if (appId) appData = getAppData(appId);
            if (!appData && appName) appData = allApps.find(a => a.name === appName);

            if (!appData) {
                if (window.AppScanner && AppScanner.getApps) {
                    AppScanner.getApps().then(function(apps) {
                        let found = null;
                        if (appId) found = apps.find(a => a.id === appId);
                        if (!found && appName) found = apps.find(a => a.name === appName);
                        if (!found) return;
                        window.__appOpenedFrom = 'notification';
                        window.__notificationOpenedAppId = found.id;
                        if (found.type === 'html') {
                            if (isPCMode) openHtmlAppPCMode(found);
                            else openHtmlApp(found);
                        } else if (found.file) {
                            const script = document.createElement('script');
                            script.src = found.file + '?t=' + Date.now();
                            script.onload = function() {
                                const initFn = window[found.id + 'Init'] ||
                                    window[found.id.replace(/-/g, '') + 'Init'];
                                if (typeof initFn === 'function') {
                                    try { initFn(); } catch(e) {}
                                }
                            };
                            document.head.appendChild(script);
                        }
                    }).catch(function() {});
                }
                return false;
            }

            window.__appOpenedFrom = 'notification';
            window.__notificationOpenedAppId = appData.id;

            if (appData.type === 'html') {
                if (isPCMode) openHtmlAppPCMode(appData);
                else openHtmlApp(appData);
                return true;
            }

            openAppWithAnimation(appData.id, null, false);
            return true;
        };

        function openHtmlAppPCMode(appData) {
            if (!appData || !appData.html) return;

            const existing = document.querySelector('.html-app-window[data-app-id="' + appData.id + '"]');
            if (existing) return;

            const token = (window.crypto && window.crypto.randomUUID)
                ? window.crypto.randomUUID()
                : 'tok_' + Date.now() + '_' + Math.random().toString(36).slice(2);

            const container = document.createElement('div');
            container.className = 'html-app-window';
            container.dataset.appId = appData.id;

            const iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-scripts allow-forms allow-popups allow-modals';
            iframe.name = token;

            let html = appData.html;
            const tokenScript = '<script>window.__collToken=' + JSON.stringify(token) + ';<\/script>';
            if (/<head[^>]*>/i.test(html)) {
                html = html.replace(/<head[^>]*>/i, function(m) { return m + tokenScript; });
            } else {
                html = tokenScript + html;
            }

            iframe.srcdoc = html;

            container.appendChild(iframe);
            document.body.appendChild(container);

            if (!window.__collTokens) window.__collTokens = {};
            window.__collTokens[token] = { appId: appData.id, created: Date.now() };

            const onMessage = function(e) {
                const d = e.data;
                if (!d || !d.__coll) return;
                if (!d.token || !window.__collTokens[d.token]) return;
                if (d.type === 'notify') {
                    if (window.LiveBar && typeof window.LiveBar.notify === 'function') {
                        window.LiveBar.notify({
                            title: d.data.title || '',
                            body: d.data.body || '',
                            type: d.data.type || 'info',
                            appId: appData.id,
                            appName: appData.name || ''
                        });
                    }
                }
            };
            window.addEventListener('message', onMessage);
            container.__onMessage = onMessage;
        }

        function openHtmlApp(appData) {
            if (!appData || !appData.html) return;

            const existing = document.querySelector('.html-app-window[data-app-id="' + appData.id + '"]');
            if (existing) {
                bringToFront(existing);
                try {
                    const prev = existing.style.transition;
                    existing.style.transition = 'filter 0.25s ease';
                    existing.style.filter = 'brightness(1.15)';
                    setTimeout(function() {
                        existing.style.filter = '';
                        existing.style.transition = prev;
                    }, 250);
                } catch(e) {}
                return;
            }

            const token = (window.crypto && window.crypto.randomUUID)
                ? window.crypto.randomUUID()
                : 'tok_' + Date.now() + '_' + Math.random().toString(36).slice(2);

            const container = document.createElement('div');
            container.className = 'html-app-window';
            container.dataset.appId = appData.id;

            const closeBtn = document.createElement('button');
            closeBtn.className = 'html-app-close-btn';
            closeBtn.textContent = '✕';
            closeBtn.addEventListener('click', function() {
                window.ShnukCloseAnimation(container, appData.id, function() {
                    if (closeBtn.parentNode) closeBtn.parentNode.removeChild(closeBtn);
                    try { delete window.__collTokens[token]; } catch(e) {}
                    try { window.removeEventListener('message', onMessage); } catch(e) {}
                });
            });

            const iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-scripts allow-forms allow-popups allow-modals';
            iframe.name = token;

            let html = appData.html;
            const tokenScript = '<script>window.__collToken=' + JSON.stringify(token) + ';<\/script>';
            if (/<head[^>]*>/i.test(html)) {
                html = html.replace(/<head[^>]*>/i, function(m) { return m + tokenScript; });
            } else {
                html = tokenScript + html;
            }

            iframe.srcdoc = html;

            container.appendChild(iframe);
            document.body.appendChild(container);
            document.body.appendChild(closeBtn);

            if (!window.__collTokens) window.__collTokens = {};
            window.__collTokens[token] = { appId: appData.id, created: Date.now() };

            const onMessage = function(e) {
                const d = e.data;
                if (!d || !d.__coll) return;
                if (!d.token || !window.__collTokens[d.token]) return;
                if (d.type === 'notify') {
                    if (window.LiveBar && typeof window.LiveBar.notify === 'function') {
                        window.LiveBar.notify({
                            title: d.data.title || '',
                            body: d.data.body || '',
                            type: d.data.type || 'info',
                            appId: appData.id,
                            appName: appData.name || ''
                        });
                    }
                }
            };
            window.addEventListener('message', onMessage);
            container.__onMessage = onMessage;

            const onEsc = function(e) {
                if (e.key === 'Escape') {
                    window.ShnukCloseAnimation(container, appData.id, function() {
                        if (closeBtn.parentNode) closeBtn.parentNode.removeChild(closeBtn);
                        window.removeEventListener('message', onMessage);
                        try { delete window.__collTokens[token]; } catch(e) {}
                    });
                    document.removeEventListener('keydown', onEsc);
                }
            };
            document.addEventListener('keydown', onEsc);
        }

        function loadApps() {
            AppScanner.scan().then(function(apps) {
                allApps = apps;
                makeOrderSnapshot();
                loadDesktop();
                if (desktopLoader) desktopLoader.style.display = 'none';
                renderDesktop();
                renderAllApps();
                applyScreenSettings();
                rebuildCollarRegistry();

                if (isPCMode) {
                    topPanel.style.display = 'none';
                    showBottomPanel();
                } else {
                    if (window.LiveBar && window.LiveBar.restore) window.LiveBar.restore();
                }
            }).catch(function(err) {
                if (desktopLoader) desktopLoader.innerHTML = '<span style="color:#cc0000;">' + T('Ошибка') + '</span>';
            });
        }

        function rebuildCollarRegistry() {
            const reg = {};
            allApps.forEach(function(a) {
                if (a && a.author === 'Collaris' && a.name) {
                    reg[a.name] = { id: a.id, name: a.name };
                }
            });
            window.__collarAppRegistry = reg;
        }

        function refreshApps() {
            if (typeof AppScanner !== 'undefined' && AppScanner.rescan) {
                AppScanner.rescan().then(function(apps) {
                    allApps = applyOrderSnapshot(apps);
                    const newIds = apps.filter(a => !appsOrderSnapshot.includes(a.id)).map(a => a.id);
                    if (newIds.length > 0) appsOrderSnapshot = allApps.map(a => a.id);
                    desktopApps = desktopApps.filter(id => allApps.some(a => a.id === id));
                    saveDesktop();
                    renderDesktop();
                    renderAllApps();
                    rebuildCollarRegistry();
                });
            }
        }
        window.refreshApps = refreshApps;
        window.rescanApps = refreshApps;

        function loadDesktop() {
            let saved = null;
            try { saved = localStorage.getItem(DESKTOP_KEY); } catch(e) {}
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    desktopApps = parsed.filter(id => allApps.some(a => a.id === id));
                } catch(e) { desktopApps = []; }
            }
            if (desktopApps.length === 0 && allApps.length > 0) {
                desktopApps = DEFAULT_DESKTOP.filter(id => allApps.some(a => a.id === id));
                if (desktopApps.length < 4) {
                    for (const a of allApps) {
                        if (!desktopApps.includes(a.id) && desktopApps.length < 4) desktopApps.push(a.id);
                    }
                }
                saveDesktop();
            }
        }

        function saveDesktop() {
            try {
                localStorage.setItem(DESKTOP_KEY, JSON.stringify(desktopApps));
                window.dispatchEvent(new CustomEvent('shnuk:desktop-changed'));
            } catch(e) {}
        }

        function renderDesktop() {
            buttonGroup.innerHTML = '';
            if (desktopApps.length === 0) {
                buttonGroup.innerHTML = '<div style="color:var(--text-muted);font-size:16px;text-align:center;width:100%;padding:20px;">' + T('Нет приложений') + '</div>';
                return;
            }
            desktopApps.forEach(function(appId, index) {
                const appData = getAppData(appId);
                if (!appData) return;

                const wrap = document.createElement('div');
                wrap.className = 'btn-wrap';

                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.dataset.id = appId;
                btn.dataset.index = index;

                const iconPath = getAppIcon(appId);
                if (iconPath) {
                    const img = document.createElement('img');
                    img.src = iconPath;
                    img.alt = getAppName(appId);
                    btn.appendChild(img);
                } else {
                    const fallback = document.createElement('span');
                    fallback.style.cssText = 'font-size:40px;color:var(--text-primary);font-weight:bold;';
                    fallback.textContent = getAppName(appId).charAt(0);
                    btn.appendChild(fallback);
                }

                btn.addEventListener('click', function(e) {
                    if (isEditMode) return;
                    if (dragState && dragState.moved) return;
                    if (findOpenAppElement(appId)) return;
                    const rect = btn.getBoundingClientRect();
                    openAppWithAnimation(appId, rect, false);
                });
                btn.addEventListener('mousedown', function(e) { if (isEditMode) startDrag(e, btn, appId); });
                btn.addEventListener('touchstart', function(e) { if (isEditMode) startDrag(e, btn, appId); }, { passive: false });

                wrap.appendChild(btn);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.textContent = '✕';
                removeBtn.title = T('Убрать с главного экрана');
                removeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    removeFromDesktop(appId);
                });
                removeBtn.addEventListener('mousedown', function(e) { e.stopPropagation(); });
                removeBtn.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });

                wrap.appendChild(removeBtn);
                buttonGroup.appendChild(wrap);
            });
            buttonGroup.classList.toggle('edit-mode', isEditMode);
        }

        function removeFromDesktop(appId) {
            desktopApps = desktopApps.filter(id => id !== appId);
            saveDesktop();
            renderDesktop();
            renderAllApps();
        }

        function renderAllApps() {
            iconGrid.innerHTML = '';
            if (allApps.length === 0) {
                iconGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);font-size:18px;">' + T('Нет приложений') + '</div>';
                return;
            }
            const sortedApps = appsOrderSnapshot ? applyOrderSnapshot(allApps) : allApps;
            let idx = 0;
            sortedApps.forEach(function(a) {
                const div = document.createElement('div');
                div.className = 'icon-item';
                if (desktopApps.includes(a.id)) div.classList.add('in-desktop');
                if (a.type === 'html') div.classList.add('html-app');
                div.dataset.appId = a.id;
                div.dataset.appName = a.name;
                div.style.animationDelay = (Math.min(idx, 24) * 0.025) + 's';
                idx++;

                if (a.icon) {
                    const img = document.createElement('img');
                    img.src = a.icon;
                    img.alt = a.name;
                    div.appendChild(img);
                } else {
                    const fallback = document.createElement('span');
                    fallback.className = 'icon-default';
                    fallback.textContent = a.name.charAt(0);
                    div.appendChild(fallback);
                }
                const label = document.createElement('span');
                label.className = 'icon-label';
                label.textContent = a.name.length > 10 ? a.name.substring(0, 10) + '…' : a.name;
                div.appendChild(label);

                div.addEventListener('click', function(e) {
                    if (isAppAnimating) return;
                    const appId = a.id;
                    if (findOpenAppElement(appId)) return;
                    const rect = div.getBoundingClientRect();
                    openAppWithAnimation(appId, rect, true);
                });
                iconGrid.appendChild(div);
            });
            bottomPanel.classList.toggle('editing', isEditMode);
            if (appsSearchInput && appsSearchInput.value.trim()) {
                performAppsMenuSearch(appsSearchInput.value);
            }
        }

        let pickerBackdrop = null;
        let pickerEscHandler = null;

        function closePicker() {
            if (!pickerBackdrop) return;
            const bd = pickerBackdrop;
            pickerBackdrop = null;
            bd.classList.remove('visible');
            if (pickerEscHandler) {
                document.removeEventListener('keydown', pickerEscHandler);
                pickerEscHandler = null;
            }
            setTimeout(function() { if (bd.parentNode) bd.parentNode.removeChild(bd); }, 300);
        }

        function openPicker() {
            if (pickerBackdrop) return;
            const appsNotOnDesktop = allApps.filter(a => !desktopApps.includes(a.id));
            const bd = document.createElement('div');
            bd.className = 'picker-backdrop';
            pickerBackdrop = bd;
            const modal = document.createElement('div');
            modal.className = 'picker-modal';
            const header = document.createElement('div');
            header.className = 'picker-header';
            const title = document.createElement('div');
            title.className = 'picker-title';
            title.textContent = T('Добавить на главный экран');
            header.appendChild(title);
            const closeBtn = document.createElement('button');
            closeBtn.className = 'picker-close';
            closeBtn.textContent = '✕';
            closeBtn.setAttribute('aria-label', 'Закрыть');
            closeBtn.addEventListener('click', function(e) { e.stopPropagation(); closePicker(); });
            header.appendChild(closeBtn);
            modal.appendChild(header);

            const body = document.createElement('div');
            body.className = 'picker-body';

            if (appsNotOnDesktop.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'picker-empty';
                empty.textContent = 'Все приложения уже на главном экране.';
                body.appendChild(empty);
            } else {
                appsNotOnDesktop.forEach(function(appData) {
                    const item = document.createElement('button');
                    item.className = 'picker-item';
                    item.type = 'button';
                    const iconWrap = document.createElement('div');
                    iconWrap.className = 'picker-icon';
                    if (appData.icon) {
                        const img = document.createElement('img');
                        img.src = appData.icon;
                        img.alt = appData.name;
                        img.onerror = function() {
                            const fb = document.createElement('div');
                            fb.className = 'picker-icon-fallback';
                            fb.textContent = appData.name.charAt(0);
                            iconWrap.innerHTML = '';
                            iconWrap.appendChild(fb);
                        };
                        iconWrap.appendChild(img);
                    } else {
                        const fb = document.createElement('div');
                        fb.className = 'picker-icon-fallback';
                        fb.textContent = appData.name.charAt(0);
                        iconWrap.appendChild(fb);
                    }
                    item.appendChild(iconWrap);
                    const nameEl = document.createElement('div');
                    nameEl.className = 'picker-name';
                    nameEl.textContent = appData.name.length > 12 ? appData.name.substring(0, 12) + '…' : appData.name;
                    item.appendChild(nameEl);
                    item.addEventListener('click', function(e) { e.stopPropagation(); pickAppForDesktop(appData.id); });
                    body.appendChild(item);
                });
            }

            modal.appendChild(body);
            bd.appendChild(modal);
            bd.addEventListener('click', function(e) { if (e.target === bd) closePicker(); });
            document.body.appendChild(bd);
            requestAnimationFrame(function() { bd.classList.add('visible'); });

            pickerEscHandler = function(e) { if (e.key === 'Escape') closePicker(); };
            document.addEventListener('keydown', pickerEscHandler);
        }

        function pickAppForDesktop(appId) {
            if (!appId) return;
            if (desktopApps.includes(appId)) { closePicker(); return; }
            closePicker();
            if (desktopApps.includes(appId)) return;
            desktopApps.push(appId);
            saveDesktop();
            renderDesktop();
            renderAllApps();
            if (isEditMode) updateAddDesktopBtn();
        }

        function updateAddDesktopBtn() {
            if (!addDesktopBtn) return;
            if (isEditMode && isBottomVisible && !isPCMode) addDesktopBtn.classList.add('visible');
            else addDesktopBtn.classList.remove('visible');
        }

        function handleAddToDesktop(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            openPicker();
        }

        addDesktopBtn.addEventListener('click', handleAddToDesktop);
        addDesktopBtn.addEventListener('mousedown', function(e) { e.stopPropagation(); });
        addDesktopBtn.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });

        function startDrag(e, btn, appId) {
            if (!isEditMode) return;
            e.preventDefault();
            if (dragState) return;
            const rect = btn.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            dragState = {
                appId: appId,
                element: btn,
                startX: touch.clientX,
                startY: touch.clientY,
                offsetX: touch.clientX - rect.left,
                offsetY: touch.clientY - rect.top,
                width: rect.width,
                height: rect.height,
                originIndex: desktopApps.indexOf(appId),
                currentTargetId: null,
                moved: false
            };
            btn.classList.add('dragging');
            btn.style.position = 'fixed';
            btn.style.left = rect.left + 'px';
            btn.style.top = rect.top + 'px';
            btn.style.width = rect.width + 'px';
            btn.style.height = rect.height + 'px';
            btn.style.zIndex = 1000;
            btn.style.pointerEvents = 'none';
            btn.style.transition = 'none';
            document.addEventListener('mousemove', onDragMove, { passive: false });
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('touchend', onDragEnd);
            document.addEventListener('touchcancel', onDragEnd);
        }

        function onDragMove(e) {
            if (!dragState) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - dragState.startX;
            const dy = touch.clientY - dragState.startY;
            if (!dragState.moved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) dragState.moved = true;
            if (!dragState.moved) return;
            const btn = dragState.element;
            const newLeft = touch.clientX - dragState.offsetX;
            const newTop = touch.clientY - dragState.offsetY;
            btn.style.left = newLeft + 'px';
            btn.style.top = newTop + 'px';
            const centerX = touch.clientX;
            const centerY = touch.clientY;
            const buttons = buttonGroup.querySelectorAll('.btn');
            let targetBtn = null;
            let minDist = Infinity;
            buttons.forEach(function(other) {
                if (other === btn) return;
                const r = other.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;
                const dist = Math.sqrt((cx - centerX) ** 2 + (cy - centerY) ** 2);
                if (dist < minDist) { minDist = dist; targetBtn = other; }
            });
            if (targetBtn && minDist < Math.max(dragState.width, dragState.height) * 1.2) {
                const targetId = targetBtn.dataset.id;
                if (targetId && targetId !== dragState.appId) dragState.currentTargetId = targetId;
            } else dragState.currentTargetId = null;
        }

        function onDragEnd(e) {
            if (!dragState) return;
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchmove', onDragMove);
            document.removeEventListener('touchend', onDragEnd);
            document.removeEventListener('touchcancel', onDragEnd);
            const btn = dragState.element;
            const targetId = dragState.currentTargetId;
            if (targetId && dragState.moved) {
                const fromIndex = desktopApps.indexOf(dragState.appId);
                const toIndex = desktopApps.indexOf(targetId);
                if (fromIndex !== -1 && toIndex !== -1 && fromIndex !== toIndex) {
                    desktopApps.splice(fromIndex, 1);
                    desktopApps.splice(toIndex, 0, dragState.appId);
                    saveDesktop();
                }
            }
            btn.style.position = '';
            btn.style.left = '';
            btn.style.top = '';
            btn.style.width = '';
            btn.style.height = '';
            btn.style.zIndex = '';
            btn.style.pointerEvents = '';
            btn.style.transition = '';
            btn.classList.remove('dragging');
            const wasMoved = dragState.moved;
            dragState = null;
            if (wasMoved) {
                renderDesktop();
                renderAllApps();
                setTimeout(function() {
                    const suppressClick = function(ev) { ev.stopPropagation(); ev.preventDefault(); };
                    document.addEventListener('click', suppressClick, { capture: true, once: true });
                }, 0);
            }
        }

        function toggleEditMode() {
            if (isPCMode) return;
            isEditMode = !isEditMode;
            topPanel.classList.toggle('editing', isEditMode);
            bottomPanel.classList.toggle('editing', isEditMode);
            renderDesktop();
            renderAllApps();
            updateAddDesktopBtn();
        }

        function showBottomPanel() {
            if (isBottomVisible || isClosing) return;
            isBottomVisible = true;
            isClosing = false;
            appBackground.classList.add('blurred');
            topPanel.classList.add('swiped-down');
            renderAllApps();

            if (appsSearchBar) appsSearchBar.classList.add('visible');
            updateAddDesktopBtn();

            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    bottomPanel.classList.add('visible');
                    bottomPanel.classList.remove('closing');
                });
            });
        }

        function hideBottomPanel() {
            if (isPCMode) return;
            if (!isBottomVisible) return;
            isBottomVisible = false;
            isClosing = true;
            bottomPanel.classList.add('closing');
            bottomPanel.classList.remove('visible');
            appBackground.classList.remove('blurred');
            topPanel.classList.remove('swiped-down');
            if (appsSearchBar) appsSearchBar.classList.remove('visible');
            hideSearchResults();
            if (appsSearchInput) appsSearchInput.value = '';
            if (addDesktopBtn) addDesktopBtn.classList.remove('visible');
            closePicker();
            setTimeout(function() {
                bottomPanel.classList.remove('closing');
                isClosing = false;
            }, 300);
        }

        closeAppsBtn.addEventListener('click', hideBottomPanel);
        editClose.addEventListener('click', function(e) {
            e.stopPropagation();
            if (isEditMode) toggleEditMode();
        });

        let longPressTimer = null;
        let longPressStartX = 0;
        let longPressStartY = 0;

        const LONG_PRESS_MS = 1000;
        const MOVE_TOLERANCE = 12;

        function cancelLongPress() {
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        }

        function pointFromEvent(e) {
            if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function isInteractiveTarget(target) {
            if (!target || !(target instanceof Element)) return false;
            if (target.closest('.btn-wrap')) return true;
            if (target.closest('.edit-title')) return true;
            if (target.closest('.edit-close')) return true;
            if (target.closest('.desktop-search')) return true;
            if (target.closest('.bottom-panel')) return true;
            if (target.closest('.apps-search-bar')) return true;
            if (target.closest('.apps-search-results')) return true;
            if (target.closest('.add-desktop-btn')) return true;
            if (target.closest('.picker-backdrop')) return true;
            if (target.closest('.html-app-window')) return true;
            if (target.closest('.win-backdrop')) return true;
            if (target.closest('#obRoot')) return true;
            if (target.closest('.pc-window')) return true;
            if (target.closest('#pcDock')) return true;
            return false;
        }

        function onLongPressStart(e) {
            if (isPCMode) return;
            if (isEditMode) return;
            if (isBottomVisible) return;
            if (isInteractiveTarget(e.target)) return;
            const p = pointFromEvent(e);
            longPressStartX = p.x;
            longPressStartY = p.y;
            cancelLongPress();
            longPressTimer = setTimeout(function() {
                longPressTimer = null;
                toggleEditMode();
            }, LONG_PRESS_MS);
        }

        function onLongPressMove(e) {
            if (!longPressTimer) return;
            const p = pointFromEvent(e);
            const dx = p.x - longPressStartX;
            const dy = p.y - longPressStartY;
            if (Math.abs(dx) > MOVE_TOLERANCE || Math.abs(dy) > MOVE_TOLERANCE) cancelLongPress();
        }

        function onLongPressEnd(e) { cancelLongPress(); }

        appBackground.addEventListener('mousedown', onLongPressStart);
        appBackground.addEventListener('mousemove', onLongPressMove);
        appBackground.addEventListener('mouseup', onLongPressEnd);
        appBackground.addEventListener('mouseleave', onLongPressEnd);
        appBackground.addEventListener('touchstart', onLongPressStart, { passive: true });
        appBackground.addEventListener('touchmove', onLongPressMove, { passive: true });
        appBackground.addEventListener('touchend', onLongPressEnd, { passive: true });
        appBackground.addEventListener('touchcancel', onLongPressEnd, { passive: true });

        appBackground.addEventListener('click', function(e) {
            if (isPCMode) return;
            if (isEditMode && !isInteractiveTarget(e.target)) toggleEditMode();
        });

        (function bindDesktopShadeSwipe() {
            let startX = 0;
            let startY = 0;
            let tracking = false;
            let moved = false;
            const DIRECTION_LOCK_PX = 12;

            function anyAppOpen() {
                for (const domId of Object.values(APP_DOM_MAP)) {
                    const el = document.getElementById(domId);
                    if (el && el.parentNode) return true;
                }
                if (document.querySelector('.html-app-window')) return true;
                if (document.querySelector('.win-backdrop')) return true;
                const shade = document.getElementById('liveBarShade');
                if (shade && shade.style.pointerEvents === 'auto') return true;
                return false;
            }

            function getPoint(e) {
                if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            function onStart(e) {
                if (isPCMode) return;
                if (isEditMode) return;
                if (isBottomVisible) return;
                if (anyAppOpen()) return;
                if (isInteractiveTarget(e.target)) return;

                const p = getPoint(e);
                startX = p.x;
                startY = p.y;
                tracking = true;
                moved = false;
            }

            function onMove(e) {
                if (!tracking) return;
                const p = getPoint(e);
                const dx = p.x - startX;
                const dy = p.y - startY;

                if (!moved && (Math.abs(dx) > DIRECTION_LOCK_PX || Math.abs(dy) > DIRECTION_LOCK_PX)) {
                    moved = true;
                    if (Math.abs(dx) > Math.abs(dy)) { tracking = false; return; }
                    if (dy < 0) { tracking = false; return; }
                }
                if (!moved) return;

                if (dy > 60 && dy > Math.abs(dx)) {
                    tracking = false;
                    if (e.cancelable) e.preventDefault();
                    if (window.LiveBar && typeof window.LiveBar.openShade === 'function') {
                        window.LiveBar.openShade();
                    }
                }
            }

            function onEnd() {
                tracking = false;
                moved = false;
            }

            appBackground.addEventListener('touchstart', onStart, { passive: true });
            appBackground.addEventListener('touchmove', onMove, { passive: false });
            appBackground.addEventListener('touchend', onEnd, { passive: true });
            appBackground.addEventListener('touchcancel', onEnd, { passive: true });

            topPanel.addEventListener('touchstart', onStart, { passive: true });
            topPanel.addEventListener('touchmove', onMove, { passive: false });
            topPanel.addEventListener('touchend', onEnd, { passive: true });
            topPanel.addEventListener('touchcancel', onEnd, { passive: true });

            let mouseTracking = false;
            let mouseStartX = 0;
            let mouseStartY = 0;
            let mouseMoved = false;

            function onMouseDown(e) {
                if (isPCMode) return;
                if (isEditMode) return;
                if (isBottomVisible) return;
                if (anyAppOpen()) return;
                if (isInteractiveTarget(e.target)) return;
                mouseStartX = e.clientX;
                mouseStartY = e.clientY;
                mouseTracking = true;
                mouseMoved = false;
            }
            function onMouseMove(e) {
                if (!mouseTracking) return;
                const dx = e.clientX - mouseStartX;
                const dy = e.clientY - mouseStartY;
                if (!mouseMoved && (Math.abs(dx) > DIRECTION_LOCK_PX || Math.abs(dy) > DIRECTION_LOCK_PX)) {
                    mouseMoved = true;
                    if (Math.abs(dx) > Math.abs(dy)) { mouseTracking = false; return; }
                    if (dy < 0) { mouseTracking = false; return; }
                }
                if (!mouseMoved) return;
                if (dy > 60 && dy > Math.abs(dx)) {
                    mouseTracking = false;
                    if (window.LiveBar && typeof window.LiveBar.openShade === 'function') {
                        window.LiveBar.openShade();
                    }
                }
            }
            function onMouseUp() { mouseTracking = false; mouseMoved = false; }

            appBackground.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        })();

        let startY = 0, isSwiping = false;
        app.addEventListener('touchstart', function(e) { startY = e.touches[0].clientY; isSwiping = true; }, { passive: true });
        app.addEventListener('touchmove', function(e) {
            if (isPCMode) return;
            if (!isSwiping) return;
            const deltaY = e.touches[0].clientY - startY;
            if (deltaY < -60 && !isBottomVisible) { e.preventDefault(); showBottomPanel(); isSwiping = false; }
            if (deltaY > 60 && isBottomVisible) { e.preventDefault(); hideBottomPanel(); isSwiping = false; }
        }, { passive: false });
        app.addEventListener('touchend', function() { isSwiping = false; }, { passive: true });
        app.addEventListener('wheel', function(e) {
            if (isPCMode) return;
            if (e.deltaY < -30 && !isBottomVisible) { e.preventDefault(); showBottomPanel(); }
            else if (e.deltaY > 30 && isBottomVisible) { e.preventDefault(); hideBottomPanel(); }
        }, { passive: false });

        let lastInstalledHash = '';
        try { lastInstalledHash = localStorage.getItem(INSTALLED_KEY) || ''; } catch(e) {}
        setInterval(function() {
            let installedRaw = '';
            try { installedRaw = localStorage.getItem(INSTALLED_KEY) || ''; } catch(e) {}
            if (installedRaw !== lastInstalledHash) {
                lastInstalledHash = installedRaw;
                refreshApps();
            }
        }, 2000);

        applyWallpaperFromStorage();
        applyScreenSettings();

        window.addEventListener('shnuk:desktop-changed', function() {
            try { loadDesktop(); } catch(e) {}
            try { renderDesktop(); } catch(e) {}
            try { renderAllApps(); } catch(e) {}
        });

        window.addEventListener('shnuk:files-changed', function() {
            try { renderDesktop(); } catch(e) {}
        });

        loadApps();
        setTimeout(ensureFullscreen, 500);
    };
    </script>

    <script>
    (function() {
        var PRELOAD_IMAGES = [
            'wall1.png', 'wall2.png', 'wall3.png',
            'camera.png', 'settings.png', 'time.png',
            'gamecenter.png', 'file.png', 'store.png',
            'recording.png', 'cooop.png', 'games.png', 'coll.png', 'myshnuk.png',
            'cursor.png'
        ];
        PRELOAD_IMAGES.forEach(function(src) {
            try { var img = new Image(); img.src = src; } catch(e) {}
        });
    })();
    </script>
