<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <title>Loading</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
        }
        #msg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="msg">Загрузка...</div>
    <script>
    (function() {
        'use strict';

        const SELF_KEY = 'shnuk_e318_html';
        const SELF_KEY_BOOT = 'shnuk_e3boot_html';

        // 1. Токен генерируется здесь и попадёт в URL index.html
        const token = 'shnuk_' + Date.now() + '_' + Math.random().toString(36).substring(2);

        // 2. Сохраняем себя и токен в localStorage
        try {
            const selfHtml = document.documentElement.outerHTML;
            if (!localStorage.getItem(SELF_KEY)) localStorage.setItem(SELF_KEY, selfHtml);
            if (!localStorage.getItem(SELF_KEY_BOOT)) localStorage.setItem(SELF_KEY_BOOT, selfHtml);
            localStorage.setItem('shnuk_current_token', token);
        } catch(e) {}

        // 3. Регистрируем Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function() {});
        }

        // 4. Хелперы IndexedDB (прямая работа, без OSStorage)
        function openIDB() {
            return new Promise(function(resolve, reject) {
                const req = indexedDB.open('shnuk_os', 1);
                req.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        db.createObjectStore('files', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('system')) {
                        db.createObjectStore('system', { keyPath: 'key' });
                    }
                };
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(req.error); };
            });
        }

        function idbPut(key, data) {
            return openIDB().then(function(db) {
                return new Promise(function(resolve) {
                    try {
                        const t = db.transaction('system', 'readwrite');
                        t.objectStore('system').put({ key: key, data: data, updated: Date.now() });
                        t.oncomplete = function() { resolve(true); };
                        t.onerror = function() { resolve(false); };
                    } catch(e) { resolve(false); }
                });
            });
        }

        function idbGet(key) {
            return openIDB().then(function(db) {
                return new Promise(function(resolve) {
                    try {
                        const t = db.transaction('system', 'readonly');
                        const req = t.objectStore('system').get(key);
                        req.onsuccess = function() {
                            const row = req.result;
                            resolve(row ? row.data : null);
                        };
                        req.onerror = function() { resolve(null); };
                    } catch(e) { resolve(null); }
                });
            });
        }

        // 5. Сохраняем e3boot и заодно подтягиваем index.html с токеном
        async function saveSelfToIDB() {
            const html = document.documentElement.outerHTML;
            await idbPut('asset:e3boot.html', { type: 'text', data: html });
        }

        async function saveStarterFromNetwork() {
            // Если e3starter уже есть и свежий — не трогаем
            try {
                const existing = await idbGet('asset:e3starter');
                if (existing && existing.data && existing.data.length > 100) {
                    // Есть копия — но убедимся, что в ней есть токен
                    if (existing.data.indexOf('__SHNUK_TOKEN') !== -1) return;
                }
            } catch(e) {}

            try {
                const url = 'index.html?t=' + encodeURIComponent(token) + '&__direct=1';
                const resp = await fetch(url, { cache: 'no-cache' });
                if (!resp || !resp.ok) return;
                const html = await resp.text();
                if (!html || html.length < 100) return;

                // Инжектим токен прямо в head — пригодится для офлайн-рендера
                let injected = html;
                if (injected.indexOf('__SHNUK_TOKEN') === -1) {
                    injected = injected.replace(
                        '<head>',
                        '<head>\n<script>window.__SHNUK_TOKEN = ' + JSON.stringify(token) + ';<' + '/script>'
                    );
                }

                await idbPut('asset:e3starter', { type: 'text', data: injected });
                await idbPut('asset:index.html', { type: 'text', data: injected });
            } catch(e) {}
        }

        // 6. Переход
        async function go() {
            try { await saveSelfToIDB(); } catch(e) {}
            try { await saveStarterFromNetwork(); } catch(e) {}

            try {
                window.location.href = 'index.html?t=' + encodeURIComponent(token);
            } catch(e) {
                document.getElementById('msg').textContent = 'Не удалось открыть систему';
            }
        }

        go();
    })();
    </script>
</body>
</html>
