<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shnuk OS — Запуск</title>
    <style>
        @font-face {
            font-family: 'ST-SimpleSquare';
            src: url('ST-SimpleSquare.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: 'ST-SimpleSquare', monospace, sans-serif;
            color: #1a1a1a;
            overflow: hidden;
        }
        .page {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            overflow-y: auto;
        }
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 28px;
            text-align: center;
        }
        .network-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
            margin-bottom: 24px;
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: #f8f8f8;
        }
        .network-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #888;
        }
        .network-status.online .dot { background: #4CAF50; }
        .network-status.offline .dot { background: #cc0000; }
        .network-status.online { color: #4CAF50; border-color: #c8e6c9; background: #f1f8f4; }
        .network-status.offline { color: #cc0000; border-color: #ffcccc; background: #fff5f5; }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }
        .choice-btn {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            background: #ffffff;
            cursor: pointer;
            font-family: 'ST-SimpleSquare', monospace;
            font-size: 15px;
            color: #1a1a1a;
            text-align: left;
            transition: all 0.2s ease;
            width: 100%;
        }
        .choice-btn:hover { border-color: #cc0000; background: #fff5f5; }
        .choice-btn:active { transform: scale(0.98); }
        .choice-btn.primary { border-color: #cc0000; background: #cc0000; color: #ffffff; }
        .choice-btn.primary:hover { background: #990000; border-color: #990000; }
        .choice-btn.primary .choice-sub { color: rgba(255,255,255,0.75); }
        .choice-btn.secondary { border-color: #333; background: #333; color: #ffffff; }
        .choice-btn.secondary:hover { background: #111; border-color: #111; }
        .choice-btn.secondary .choice-sub { color: rgba(255,255,255,0.7); }
        .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .choice-title { font-size: 15px; font-weight: 600; }
        .choice-sub { font-size: 11px; color: #888; letter-spacing: 0.3px; }
        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #bbb;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="os-storage.js"></script>
</head>
<body>
    <div class="page">
        <img src="icoon.png" alt="Shnuk OS" class="logo" onerror="this.style.display='none'" />
        <div class="title">SHNUK OS</div>
        <div class="subtitle">Выберите способ запуска</div>

        <div class="network-status" id="netStatus">
            <span class="dot"></span>
            <span id="netText">Проверка сети...</span>
        </div>

        <div class="choices">
            <button class="choice-btn primary" id="btnOnline">
                <span class="choice-title">Открыть онлайн</span>
                <span class="choice-sub">Перейти на стартовую страницу загрузки</span>
            </button>
            <button class="choice-btn secondary" id="btnOffline">
                <span class="choice-title">Открыть офлайн</span>
                <span class="choice-sub">Запустить сохранённую копию системы</span>
            </button>
        </div>

        <div class="footer-note" id="footerNote">
            Проверка офлайн-копии...
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        function updateNetStatus() {
            const el = document.getElementById('netStatus');
            const txt = document.getElementById('netText');
            if (!el || !txt) return;
            const online = navigator.onLine;
            el.classList.toggle('online', online);
            el.classList.toggle('offline', !online);
            txt.textContent = online ? 'Сеть доступна' : 'Сети нет';
        }

        window.addEventListener('online', updateNetStatus);
        window.addEventListener('offline', updateNetStatus);

        function openOnline() {
            const btn = document.getElementById('btnOnline');
            btn.disabled = true;
            btn.querySelector('.choice-title').innerHTML = '<span class="spinner"></span>Переход...';
            setTimeout(function() {
                window.location.href = 'e3boot.html';
            }, 100);
        }

        async function readStarterHtml() {
            if (!window.OSStorage) return null;
            try {
                const a = await window.OSStorage.system.get('asset:e3starter');
                if (a && a.type === 'text' && a.data && a.data.length > 100) return a.data;
            } catch(e) {}
            try {
                const b = await window.OSStorage.system.get('asset:index.html');
                if (b && b.type === 'text' && b.data && b.data.length > 100) return b.data;
            } catch(e) {}
            if ('caches' in window) {
                try {
                    const cache = await caches.open('shnuk-cache-v1');
                    let m = await cache.match('index.html');
                    if (m) return await m.text();
                    m = await cache.match('/index.html');
                    if (m) return await m.text();
                } catch(e) {}
            }
            return null;
        }

        function renderIndexHtml(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            document.head.innerHTML = doc.head.innerHTML;
            document.body.innerHTML = doc.body.innerHTML;

            // Перезапускаем скрипты — сначала инлайн в head, потом все в body
            const inlineHead = [];
            document.head.querySelectorAll('script').forEach(function(s) {
                if (!s.src) inlineHead.push(s);
            });
            inlineHead.forEach(function(oldScript) {
                const newScript = document.createElement('script');
                newScript.textContent = oldScript.textContent;
                Array.from(oldScript.attributes).forEach(function(attr) {
                    newScript.setAttribute(attr.name, attr.value);
                });
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });

            const bodyScripts = document.body.querySelectorAll('script');
            bodyScripts.forEach(function(oldScript) {
                const newScript = document.createElement('script');
                if (oldScript.src) {
                    newScript.src = oldScript.src;
                } else {
                    newScript.textContent = oldScript.textContent;
                }
                Array.from(oldScript.attributes).forEach(function(attr) {
                    if (attr.name !== 'src') newScript.setAttribute(attr.name, attr.value);
                });
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        async function openOffline() {
            const btn = document.getElementById('btnOffline');
            const footer = document.getElementById('footerNote');
            btn.disabled = true;
            btn.querySelector('.choice-title').innerHTML = '<span class="spinner"></span>Загрузка...';

            const html = await readStarterHtml();

            if (html) {
                renderIndexHtml(html);
            } else {
                btn.disabled = false;
                btn.querySelector('.choice-title').textContent = 'Открыть офлайн';
                if (footer) {
                    footer.innerHTML = '<span style="color:#cc0000;">Сохранённой копии нет.</span><br>Сначала откройте систему онлайн.';
                }
            }
        }

        async function checkOfflineAvailable() {
            const html = await readStarterHtml();
            return !!html;
        }

        async function init() {
            updateNetStatus();

            const hasOffline = await checkOfflineAvailable();
            const footer = document.getElementById('footerNote');

            if (hasOffline) {
                if (footer) footer.innerHTML = '<span style="color:#4CAF50;">Офлайн-копия найдена.</span><br>Можно запускать без интернета.';
            } else {
                if (footer) footer.innerHTML = 'Офлайн-копии пока нет.<br>Сначала откройте систему онлайн.';
            }

            document.getElementById('btnOnline').addEventListener('click', openOnline);
            document.getElementById('btnOffline').addEventListener('click', openOffline);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
