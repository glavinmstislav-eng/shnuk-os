<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <title>Loading</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
        }
        #msg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="msg">Загрузка...</div>
    <script>
    (function() {
        'use strict';

        const SELF_KEY = 'shnuk_e318_html';
        const SELF_KEY_BOOT = 'shnuk_e3boot_html';

        // 1. Сохраняем себя в localStorage
        try {
            const selfHtml = document.documentElement.outerHTML;
            if (!localStorage.getItem(SELF_KEY)) localStorage.setItem(SELF_KEY, selfHtml);
            if (!localStorage.getItem(SELF_KEY_BOOT)) localStorage.setItem(SELF_KEY_BOOT, selfHtml);
        } catch(e) {}

        // 2. Регистрируем Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function() {});
        }

        // 3. Сохраняем себя в IndexedDB под ключами e3boot
        function openIDB() {
            return new Promise(function(resolve, reject) {
                const req = indexedDB.open('shnuk_os', 1);
                req.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        db.createObjectStore('files', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('system')) {
                        db.createObjectStore('system', { keyPath: 'key' });
                    }
                };
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(req.error); };
            });
        }

        function idbPut(key, data) {
            return openIDB().then(function(db) {
                return new Promise(function(resolve) {
                    try {
                        const t = db.transaction('system', 'readwrite');
                        t.objectStore('system').put({ key: key, data: data, updated: Date.now() });
                        t.oncomplete = function() { resolve(true); };
                        t.onerror = function() { resolve(false); };
                    } catch(e) { resolve(false); }
                });
            });
        }

        function saveSelfToIDB() {
            const html = document.documentElement.outerHTML;
            const payload = { type: 'text', data: html };
            return Promise.all([
                idbPut('asset:e3boot.html', payload),
                idbPut('asset:e3starter', payload)
            ]);
        }

        // 4. Редирект на index.html
        async function go() {
            try { await saveSelfToIDB(); } catch(e) {}

            const token = 'shnuk_' + Date.now() + '_' + Math.random().toString(36).substring(2);
            try {
                window.location.href = 'index.html?t=' + encodeURIComponent(token);
            } catch(e) {
                document.getElementById('msg').textContent = 'Не удалось открыть систему';
            }
        }

        go();
    })();
    </script>
</body>
</html>
